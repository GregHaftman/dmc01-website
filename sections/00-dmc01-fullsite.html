<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DMC01 — Full site preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     LOCAL-PREVIEW ONLY

     Stitches the section embeds into one scrollable page via
     same-origin iframes. Each iframe loads its standalone HTML file,
     so every section keeps its own self-contained <style>+<script>
     with zero cross-section CSS/JS conflicts.

     The NAV is special: it needs `position: fixed` against the
     parent's viewport, and an iframe can't pin itself to its parent.
     So the nav is inlined here (mirrors dmc01-nav.html) — keep them
     in sync. The fullsite preview uses the same nav HTML/CSS/JS that
     would be embedded once in Webflow at the top of the page.

     Auto-sizing & cross-iframe event bridges below let the preview
     behave like a real continuous site. Open with Live Server.
     ============================================================ */

  :root {
    --brand-blue:        var(--accent-primary, #0047FF);
    --brand-blue-hover:  var(--accent-primary-hover, #3c6ce7);
    --neutral-primary:   var(--bg-primary, #070708);
    --font:              var(--font-body, "Rajdhani", system-ui, sans-serif);
    --t-base-size:    var(--base-font-size, 1rem);
    --t-eyebrow-size: var(--eyebrow-size, 0.8rem);
    --w-base:  var(--base-font-weight, 400);
    --white:    var(--text-primary, #FFFFFF);
    --white-72: rgba(255, 255, 255, 0.72);
    --white-30: rgba(255, 255, 255, 0.30);
    --white-15: var(--border-secondary, rgba(255, 255, 255, 0.15));
    --blue-glow: var(--accent-primary-glow, rgba(0, 71, 255, 0.55));
    --radius-sm: var(--radius-base, 2px);
    --radius-md: calc(var(--radius-sm) * 2);
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--neutral-primary);
    color: var(--white);
    font-family: var(--font);
    overflow-x: hidden;
  }
  iframe {
    display: block;
    width: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    height: 100vh;  /* Resized to fit content by the script below. */
  }

  /* ============================================================
     NAV — copy of dmc01-nav.html's CSS/markup.
     Keep in sync with sections/dmc01-nav.html.
     ============================================================ */
  .dmc01-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: linear-gradient(180deg, rgba(7,7,8,0.96) 0%, rgba(7,7,8,0.78) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--white-15);
    opacity: 0;
    transform: translateY(-100%);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .dmc01-nav.is-visible {
    opacity: 1; transform: translateY(0); pointer-events: auto;
  }
  .nav-inner {
    max-width: 1700px; margin: 0 auto;
    padding: 14px clamp(20px, 3vw, 40px);
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .nav-brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: var(--white); transition: opacity 0.2s ease; }
  .nav-brand:hover { opacity: 0.85; }
  .nav-logo { width: 38px; height: 38px; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(0,71,255,0.45)); }
  .nav-logo svg { width: 100%; height: 100%; display: block; }
  .nav-logo .mark-stroke { stroke: var(--white); stroke-width: 28; stroke-miterlimit: 10; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .nav-wordmark { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; line-height: 1; }
  .wordmark-line { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--white); }
  .wordmark-line-2 { color: var(--brand-blue); font-weight: 700; }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .nav-cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    background: var(--brand-blue); color: var(--white);
    font-family: inherit; font-size: var(--t-base-size); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; border: 1px solid var(--brand-blue); border-radius: var(--radius-sm);
    transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .nav-cta:hover { background: var(--brand-blue-hover); box-shadow: 0 0 28px rgba(0,71,255,0.45); transform: translateY(-1px); }
  .nav-cta-arrow { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s ease; }
  .nav-cta:hover .nav-cta-arrow { transform: translateX(3px); }
  .nav-menu-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: transparent;
    border: 1px solid var(--white-15); color: var(--white);
    font-family: inherit; font-size: var(--t-base-size); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; border-radius: var(--radius-sm);
    transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
  }
  .nav-menu-btn:hover { border-color: var(--white-30); background: rgba(255,255,255,0.04); }
  .nav-menu-btn[aria-expanded="true"] { border-color: var(--brand-blue); background: rgba(0,71,255,0.10); color: var(--brand-blue); }
  .nav-menu-chevron { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s ease; }
  .nav-menu-btn[aria-expanded="true"] .nav-menu-chevron { transform: rotate(180deg); }

  .nav-panel {
    position: absolute; top: calc(100% + 8px); right: clamp(20px, 3vw, 40px);
    width: 360px; max-width: calc(100vw - 32px);
    background: var(--neutral-primary); border: 1px solid var(--white-15); border-radius: var(--radius-md);
    padding: 24px; box-shadow: 0 14px 48px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(-12px); pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .nav-panel.is-open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .nav-panel::after {
    content: ""; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
    pointer-events: none;
    background:
      linear-gradient(to right,  var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) top    / 100% 1px no-repeat,
      linear-gradient(to right,  var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) bottom / 100% 1px no-repeat,
      linear-gradient(to bottom, var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) left   / 1px 100% no-repeat,
      linear-gradient(to bottom, var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) right  / 1px 100% no-repeat;
    opacity: 0.4;
  }
  .nav-panel-section { margin-bottom: 20px; }
  .nav-panel-section:last-child { margin-bottom: 0; }
  .nav-panel-eyebrow {
    font-size: var(--t-eyebrow-size); font-weight: 600;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--brand-blue);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--white-15);
  }
  .nav-panel-list { list-style: none; display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; }
  .nav-panel-list a {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0; color: var(--white-72);
    font-size: var(--t-base-size); font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease, padding-left 0.25s cubic-bezier(0.2,0.7,0.2,1);
  }
  .nav-panel-list a:hover { color: var(--brand-blue); padding-left: 6px; }
  .nav-panel-list a .nav-panel-num {
    font-size: var(--t-eyebrow-size); font-weight: 700; letter-spacing: 0.15em;
    color: var(--white-30); min-width: 24px; transition: color 0.2s ease;
  }
  .nav-panel-list a:hover .nav-panel-num { color: var(--brand-blue); }
  .nav-panel-list a .nav-panel-arrow {
    margin-left: auto; width: 12px; height: 12px;
    stroke: var(--white-30); fill: none; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transform: translateX(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease, stroke 0.2s ease;
  }
  .nav-panel-list a:hover .nav-panel-arrow { opacity: 1; transform: translateX(0); stroke: var(--brand-blue); }

  @media (max-width: 720px) {
    .nav-inner { padding: 10px 16px; gap: 8px; }
    .nav-wordmark { display: none; }
    .nav-cta { padding: 8px 12px; font-size: 0.85rem; letter-spacing: 0.05em; }
    .nav-menu-btn { padding: 8px 12px; font-size: 0.85rem; }
    .nav-panel { right: 16px; left: 16px; width: auto; }
  }
</style>
</head>
<body>

<!-- ================ NAV (inline copy of dmc01-nav.html) ================ -->
<header class="dmc01-nav" id="dmc01Nav" role="banner">
  <div class="nav-inner">
    <a class="nav-brand" href="#dmc01-intro" aria-label="DMC01 — back to top">
      <span class="nav-logo" aria-hidden="true">
        <svg viewBox="0 0 595.28 595.28" xmlns="http://www.w3.org/2000/svg">
          <polyline class="mark-stroke" points="297.17 265.57 417.4 148.9 177.87 148.9 297.19 479.32 297.17 265.57 177.87 148.9"/>
        </svg>
      </span>
      <span class="nav-wordmark">
        <span class="wordmark-line">DMC</span>
        <span class="wordmark-line wordmark-line-2">01</span>
      </span>
    </a>
    <div class="nav-actions">
      <a class="nav-cta" href="#dmc01-contact" data-target="contact">

        </svg>
      </a>
      <button class="nav-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="dmc01NavPanel">

        <svg class="nav-menu-chevron" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="nav-panel" id="dmc01NavPanel" role="menu" aria-label="Site menu">
    <div class="nav-panel-section">
      <div class="nav-panel-eyebrow">On this page</div>
      <ul class="nav-panel-list">
        <li><a href="#dmc01-intro" data-target="intro" role="menuitem"><span class="nav-panel-num">01</span><span>Hero</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
        <li><a href="#dmc01-services" data-target="orbital" role="menuitem"><span class="nav-panel-num">02</span><span>Services</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
        <li><a href="#dmc01-tailored" data-target="tailored" role="menuitem"><span class="nav-panel-num">03</span><span>Use cases</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
        <li><a href="#dmc01-framework" data-target="framework" role="menuitem"><span class="nav-panel-num">04</span><span>Framework</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
        <li><a href="#dmc01-testimonials" data-target="testimonials" role="menuitem"><span class="nav-panel-num">05</span><span>Work with me</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
        <li><a href="#dmc01-contact" data-target="contact" role="menuitem"><span class="nav-panel-num">06</span><span>Open a brief</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
      </ul>
    </div>
    <div class="nav-panel-section">
      <div class="nav-panel-eyebrow">Other pages</div>
      <ul class="nav-panel-list">
        <li><a href="/pricing" role="menuitem"><span class="nav-panel-num">→</span><span>Pricing</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
        <li><a href="/faq" role="menuitem"><span class="nav-panel-num">→</span><span>FAQ</span><svg class="nav-panel-arrow" viewBox="0 0 14 10"><path d="M1 5h12m0 0L9 1m4 4L9 9"/></svg></a></li>
      </ul>
    </div>
  </div>
</header>

<!-- ================ SECTION IFRAMES ================ -->
<iframe src="01-dmc01-intro.html"     title="DMC01 — Data Monetisation Concept" data-section="intro"></iframe>
<iframe src="02-dmc01-orbital.html"   title="DMC01 — Specialised advisory"     data-section="orbital"></iframe>
<iframe src="03-dmc01-tailored.html"  title="DMC01 — Tailored to your context" data-section="tailored"></iframe>
<iframe src="04-dmc01-framework.html"    title="DMC01 — Powered by a rigorous framework" data-section="framework"></iframe>
<iframe src="05-dmc01-testimonials.html" title="DMC01 — Work with me, what to expect?"     data-section="testimonials"></iframe>
<iframe src="06-dmc01-contact.html"      title="DMC01 — Open a brief"                      data-section="contact"></iframe>
<iframe src="dmc01-footer.html"          title="DMC01 — Footer"                            data-section="footer"></iframe>

<script>
(function() {
  'use strict';

  /* ============================================================
     IFRAME AUTO-SIZE (unchanged from before)
     ============================================================ */
  function fit(iframe) {
    const doc = iframe.contentDocument;
    if (!doc || !doc.body) return;
    const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
    if (h && parseInt(iframe.style.height, 10) !== h) iframe.style.height = h + 'px';
  }
  const frames = Array.from(document.querySelectorAll('iframe'));
  frames.forEach(function(iframe) {
    iframe.addEventListener('load', function() {
      fit(iframe);
      try {
        const ro = new ResizeObserver(function() { fit(iframe); });
        ro.observe(iframe.contentDocument.body);
      } catch (e) { setInterval(function() { fit(iframe); }, 500); }
      window.addEventListener('resize', function() { fit(iframe); });
    });
  });

  /* ============================================================
     CROSS-EMBED BRIDGE — tailored "Modules" pill → orbital open.
     Same as before; survives even now that nav scrolls the page. */
  function bridge() {
    const tailored = document.querySelector('iframe[data-section="tailored"]');
    const orbital  = document.querySelector('iframe[data-section="orbital"]');
    if (!tailored || !orbital) return;
    const td = tailored.contentDocument, od = orbital.contentDocument;
    if (!td || !od) return;
    td.addEventListener('dmc01:openModule', function(e) {
      od.dispatchEvent(new CustomEvent('dmc01:openModule', { detail: e.detail }));
      orbital.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
  let loaded = 0;
  ['tailored', 'orbital'].forEach(function(name) {
    const f = document.querySelector('iframe[data-section="' + name + '"]');
    if (!f) return;
    f.addEventListener('load', function() {
      loaded++;
      if (loaded === 2) bridge();
    });
  });

  /* ============================================================
     NAV BEHAVIOUR (in this preview the nav lives in the parent
     document, not in an iframe — so it sees parent scroll directly).

     Visibility:
       Show the nav once the intro iframe's bottom edge is past 40%
       of the viewport. The intro section's standalone JS also
       toggles its own `.is-leaving` class — but because the intro
       sits inside an iframe here, the iframe never scrolls, so we
       cross into its document and toggle the class ourselves.

     Menu:
       Standard click-outside / Esc / link-click close behaviour.
       Anchor links resolve to in-page IDs that live inside iframes,
       so we intercept clicks and scroll the parent to the right
       iframe instead of doing default hash navigation.
     ============================================================ */
  const nav       = document.querySelector('.dmc01-nav');
  const menuBtn   = nav.querySelector('.nav-menu-btn');
  const menuPanel = nav.querySelector('.nav-panel');

  function syncOnScroll() {
    const introFrame = document.querySelector('iframe[data-section="intro"]');
    if (!introFrame) return;
    const rect = introFrame.getBoundingClientRect();
    const isPast = rect.bottom < window.innerHeight * 0.4;
    nav.classList.toggle('is-visible', isPast);
    /* Mirror the leaving state inside the intro iframe so its corner
       mark fades at the same threshold the nav appears. */
    try {
      const introSection = introFrame.contentDocument
        && introFrame.contentDocument.querySelector('.intro-section');
      if (introSection) introSection.classList.toggle('is-leaving', isPast);
    } catch (e) { /* iframe not loaded yet */ }
  }
  syncOnScroll();
  window.addEventListener('scroll', syncOnScroll, { passive: true });
  window.addEventListener('resize', syncOnScroll, { passive: true });

  function setOpen(open) {
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuPanel.classList.toggle('is-open', open);
  }
  menuBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    setOpen(menuBtn.getAttribute('aria-expanded') !== 'true');
  });
  document.addEventListener('click', function(e) {
    if (!nav.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') setOpen(false);
  });

  /* In-page anchors target IDs that live inside the section iframes.
     The browser can't resolve those from the parent document, so we
     map data-target → iframe and scroll to the iframe instead. */
  menuPanel.querySelectorAll('a[data-target]').forEach(function(a) {
    a.addEventListener('click', function(e) {
      const target = a.getAttribute('data-target');
      const f = document.querySelector('iframe[data-section="' + target + '"]');
      if (f) {
        e.preventDefault();
        f.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      setOpen(false);
    });
  });
  /* External page links (Pricing/FAQ) just close the menu. */
  menuPanel.querySelectorAll('a:not([data-target])').forEach(function(a) {
    a.addEventListener('click', function() { setOpen(false); });
  });

  /* The "Start a project" CTA also scrolls to the contact iframe. */
  const ctaLink = nav.querySelector('.nav-cta[data-target]');
  if (ctaLink) {
    ctaLink.addEventListener('click', function(e) {
      const target = ctaLink.getAttribute('data-target');
      const f = document.querySelector('iframe[data-section="' + target + '"]');
      if (f) {
        e.preventDefault();
        f.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }

  /* Brand mark scrolls back to top of page (intro iframe). */
  document.querySelector('.nav-brand').addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setOpen(false);
  });

  console.log('[DMC01-fullsite] Preview shell loaded — nav + 4 section iframes mounted.');
})();
</script>

</body>
</html>
