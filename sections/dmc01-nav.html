<style>
  /* ============================================================
     DMC01 · Site nav — sticky page header
     Hidden by default; slides in once the user has scrolled past
     the intro section. Houses the brand mark + wordmark on the left
     and a CTA + Menu dropdown on the right. The dropdown groups
     in-page anchors and other pages (Pricing, FAQ).

     Designed to be embedded once at the top of the Webflow page.
     The fullsite preview shell inlines the same markup for local
     scrolling — see 00-dmc01-fullsite.html.
     ============================================================ */

  :root {
    --brand-blue:        var(--accent-primary, #0047FF);
    --brand-blue-hover:  var(--accent-primary-hover, #3c6ce7);
    --neutral-primary:   var(--bg-primary, #070708);
    --neutral-secondary: var(--bg-secondary, #161617);
    --font:              var(--font-body, "Rajdhani", system-ui, sans-serif);
    --t-base-size:    var(--base-font-size, 1.1rem);
    --t-eyebrow-size: var(--eyebrow-size, 1.1rem);
    --w-base:  var(--base-font-weight, 400);
    --w-bold:  var(--base-font-weight-bold, 600);
    --white:    var(--text-primary, #FFFFFF);
    --white-72: rgba(255, 255, 255, 0.88);
    --white-50: rgba(255, 255, 255, 0.62);
    --white-30: rgba(255, 255, 255, 0.30);
    --white-15: var(--border-secondary, rgba(255, 255, 255, 0.15));
    --blue-glow: var(--accent-primary-glow, rgba(0, 71, 255, 0.55));

    /* Border radius — derived from --radius-base (Webflow alias).
       sm = base, md = 2× base. Tweak --radius-base to scale all
       rectangle corners across the site proportionally. */
    --radius-sm: var(--radius-base, 2px);
    --radius-md: calc(var(--radius-sm) * 2);

    /* Nav-bar background — themed via tokens below so light theme
       gets a translucent white bar instead of translucent black. */
    --nav-bg-top:    rgba(7, 7, 8, 0.96);
    --nav-bg-bottom: rgba(7, 7, 8, 0.78);
  }

  /* Light theme — see 01-dmc01-intro.html for the rationale. */
  [data-theme="light"] {
    --neutral-primary:   #f5f5f7;
    --neutral-secondary: #ffffff;
    --white:    #070708;
    --white-72: rgba(7, 7, 8, 0.85);
    --white-50: rgba(7, 7, 8, 0.68);
    --white-30: rgba(7, 7, 8, 0.42);
    --white-15: rgba(7, 7, 8, 0.10);
    --nav-bg-top:    rgba(245, 245, 247, 0.96);
    --nav-bg-bottom: rgba(245, 245, 247, 0.82);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--neutral-primary);
    color: var(--white);
    font-family: var(--font);
    font-weight: var(--w-base);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     NAV BAR
     ============================================================ */
  .dmc01-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: linear-gradient(180deg, var(--nav-bg-top) 0%, var(--nav-bg-bottom) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--white-15);
    /* Hidden until the user scrolls past intro. */
    opacity: 0;
    transform: translateY(-100%);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .dmc01-nav.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .nav-inner {
    max-width: 1700px;
    margin: 0 auto;
    padding: 14px clamp(20px, 3vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  /* ----- BRAND (logo + wordmark) ----- */
  .nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--white);
    transition: opacity 0.2s ease;
  }
  .nav-brand:hover { opacity: 0.85; }

  /* Combined logo lockup — mark + DMC01 wordmark in one SVG.
     The viewBox crops to the artwork so the lockup fills its
     container without empty padding. Stroke + fill follow the
     theme via var(--white). */
  .nav-logo {
    width: 60px;
    height: 50px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px rgba(0, 71, 255, 0.45));
  }
  .nav-logo svg { width: 100%; height: 100%; display: block; }
  .nav-logo .mark-stroke {
    stroke: var(--white);
    stroke-width: 18;
    stroke-miterlimit: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  .nav-logo .mark-fill {
    fill: var(--white);
  }
  /* Light mode — the logo turns near-black, and the original 8px
     blue halo reads as a heavy bloom against pale chrome. Soften. */
  [data-theme="light"] .nav-logo {
    filter: drop-shadow(0 0 4px rgba(0, 71, 255, 0.20));
  }

  /* ----- ACTIONS (CTA + Menu) ----- */
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: var(--brand-blue);
    /* Hard-coded #fff — the CTA sits on a brand-blue background in
       both themes, so the text must always be white (var(--white)
       would flip to near-black in light mode). */
    color: #ffffff;
    font-family: inherit;
    font-size: var(--t-base-size);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--brand-blue);
    border-radius: var(--radius-sm);
    transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .nav-cta:hover {
    background: var(--brand-blue-hover);
    color: #ffffff;
    box-shadow: 0 0 28px rgba(0, 71, 255, 0.45);
    transform: translateY(-1px);
  }
  .nav-cta-arrow {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.25s ease;
  }
  .nav-cta:hover .nav-cta-arrow { transform: translateX(3px); }

  .nav-menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: transparent;
    border: 1px solid var(--white-15);
    color: var(--white);
    font-family: inherit;
    font-size: var(--t-base-size);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .nav-menu-btn:hover {
    border-color: var(--white-30);
    background: rgba(255, 255, 255, 0.04);
  }
  .nav-menu-btn[aria-expanded="true"] {
    border-color: var(--brand-blue);
    background: rgba(0, 71, 255, 0.10);
    color: var(--brand-blue);
  }
  .nav-menu-chevron {
    width: 12px; height: 12px;
    stroke: currentColor; fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.3s ease;
  }
  .nav-menu-btn[aria-expanded="true"] .nav-menu-chevron {
    transform: rotate(180deg);
  }

  /* ============================================================
     MENU PANEL (dropdown)
     Anchored top-right, slides down from the nav bar.
     ============================================================ */
  .nav-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: clamp(20px, 3vw, 40px);
    width: 360px;
    max-width: calc(100vw - 32px);
    background: var(--neutral-primary);
    border: 1px solid var(--white-15);
    border-radius: var(--radius-md);
    padding: 24px;
    box-shadow: 0 14px 48px rgba(0, 0, 0, 0.55);
    opacity: 0;
    transform: translateY(-12px);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .nav-panel.is-open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  /* Subtle corner brackets — same architectural detail used on the
     orbital and framework panels. */
  .nav-panel::after {
    content: "";
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    pointer-events: none;
    background:
      linear-gradient(to right,  var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) top    / 100% 1px no-repeat,
      linear-gradient(to right,  var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) bottom / 100% 1px no-repeat,
      linear-gradient(to bottom, var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) left   / 1px 100% no-repeat,
      linear-gradient(to bottom, var(--brand-blue) 0, var(--brand-blue) 14px, transparent 14px, transparent calc(100% - 14px), var(--brand-blue) calc(100% - 14px), var(--brand-blue) 100%) right  / 1px 100% no-repeat;
    opacity: 0.4;
  }

  .nav-panel-section { margin-bottom: 20px; }
  .nav-panel-section:last-child { margin-bottom: 0; }

  .nav-panel-eyebrow {
    font-size: var(--t-eyebrow-size);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--brand-blue);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--white-15);
  }

  .nav-panel-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0;
    padding: 0;
  }

  .nav-panel-list a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    color: var(--white-72);
    font-size: var(--t-base-size);
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease, padding-left 0.25s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .nav-panel-list a:hover {
    color: var(--brand-blue);
    padding-left: 6px;
  }
  .nav-panel-list a .nav-panel-num {
    font-size: var(--t-eyebrow-size);
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--white-30);
    min-width: 24px;
    transition: color 0.2s ease;
  }
  .nav-panel-list a:hover .nav-panel-num { color: var(--brand-blue); }
  .nav-panel-list a .nav-panel-arrow {
    margin-left: auto;
    width: 12px; height: 12px;
    stroke: var(--white-30);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease, stroke 0.2s ease;
  }
  .nav-panel-list a:hover .nav-panel-arrow {
    opacity: 1;
    transform: translateX(0);
    stroke: var(--brand-blue);
  }

  /* ============================================================
     THEME TOGGLE — segmented Dark / Light, sits in the menu panel
     ============================================================ */
  .nav-theme-toggle {
    display: flex;
    margin-top: 8px;
    border: 1px solid var(--white-15);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 0;
  }
  .nav-theme-option {
    flex: 1;
    background: transparent;
    border: 0;
    /* Bumped from --white-50 → --white-72 so the inactive option
       (e.g. "Light" when dark mode is active) stays clearly readable
       in both themes. */
    color: var(--white-72);
    font-family: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 8px 10px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .nav-theme-option:hover { color: var(--white); }
  .nav-theme-option.is-active {
    background: var(--brand-blue);
    color: #ffffff; /* always white on blue, both themes */
  }
  .nav-theme-icon {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px) {
    .nav-inner { padding: 10px 16px; gap: 8px; }
    .nav-logo { width: 52px; height: 44px; }
    .nav-cta { padding: 8px 12px; font-size: 0.85rem; letter-spacing: 0.05em; }
    .nav-menu-btn { padding: 8px 12px; font-size: 0.85rem; }
    .nav-panel { right: 16px; left: 16px; width: auto; }
  }
</style>
</head>

        <button type="button" class="nav-theme-option" data-theme="dark"
                role="radio" aria-checked="true">
          <svg class="nav-theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span>Dark</span>
        </button>
        <button type="button" class="nav-theme-option" data-theme="light"
                role="radio" aria-checked="false">
          <svg class="nav-theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span>Light</span>
        </button>
      </div>
    </div>
  </div>
</header>

<script>
(function() {
  'use strict';

  /* Defensive against duplicates: if the nav embed is rendered more
     than once on a page (e.g. a Webflow Component placed alongside a
     direct embed), each .dmc01-nav scopes its own bindings via
     initOne(nav). A flag on the element prevents double-binding when
     the script itself is loaded twice. setTheme is module-level so
     theme toggles in any nav copy stay in sync. */

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.nav-theme-option').forEach(function(b) {
      const active = b.dataset.theme === theme;
      b.classList.toggle('is-active', active);
      b.setAttribute('aria-checked', active ? 'true' : 'false');
    });
    try { localStorage.setItem('dmc01-theme', theme); } catch (e) {}
  }

  function initOne(nav) {
    if (nav._dmc01Init) return;
    nav._dmc01Init = true;

    const menuBtn   = nav.querySelector('.nav-menu-btn');
    const menuPanel = nav.querySelector('.nav-panel');
    if (!menuBtn || !menuPanel) {
      console.error('[DMC01-nav] menu button or panel missing.');
      return;
    }

    /* ---------- VISIBILITY ----------
       The nav appears once the intro section has been mostly scrolled
       past. We watch the .intro-section's bottom edge — when it sits
       above 40% of the viewport, the nav fades in. If there's no intro
       section on the page (e.g. Pricing or FAQ pages), the nav shows
       immediately. */
    function syncVisibility() {
      const intro = document.querySelector('.intro-section');
      let shouldShow;
      if (intro) {
        const rect = intro.getBoundingClientRect();
        shouldShow = rect.bottom < window.innerHeight * 0.4;
      } else {
        shouldShow = true;
      }
      nav.classList.toggle('is-visible', shouldShow);
    }
    syncVisibility();
    window.addEventListener('scroll', syncVisibility, { passive: true });
    window.addEventListener('resize', syncVisibility, { passive: true });

    /* ---------- MENU TOGGLE ---------- */
    function setOpen(open) {
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menuPanel.classList.toggle('is-open', open);
    }

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const isOpen = menuBtn.getAttribute('aria-expanded') === 'true';
      setOpen(!isOpen);
    });

    /* Click outside → close. */
    document.addEventListener('click', function(e) {
      if (!nav.contains(e.target)) setOpen(false);
    });
    /* Esc → close. */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') setOpen(false);
    });
    /* Click any link → close (so the menu doesn't linger after nav). */
    menuPanel.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() { setOpen(false); });
    });

    /* ---------- THEME TOGGLE ---------- */
    nav.querySelectorAll('.nav-theme-option').forEach(function(b) {
      b.addEventListener('click', function() { setTheme(b.dataset.theme); });
    });

    console.log('[DMC01-nav] Initialised.');
  }

  function init() {
    /* Sync the theme buttons in any nav copy to whatever the FOUC
       script picked on <html data-theme="…">. */
    setTheme(document.documentElement.getAttribute('data-theme') || 'dark');
    const navs = document.querySelectorAll('.dmc01-nav');
    if (!navs.length) {
      console.error('[DMC01-nav] Could not find .dmc01-nav.');
      return;
    }
    navs.forEach(initOne);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
