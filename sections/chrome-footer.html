<title>DMC01 — Footer</title>

<script>(function(){try{var t=localStorage.getItem('dmc01-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<style>
  /* ============================================================
     DMC01 · Site footer
     Page-chrome embed (no scroll-order number, like the nav).
     Two zones separated by a hairline:
       Top    — brand on the left, legal links on the right.
       Bottom — company registration info on the left, copyright
                on the right.
     Stacks centred on mobile.
     ============================================================ */

  /* @dmc01-tokens:start */
  :root {
    /* surfaces — kit */
    --bg:          #0c0d11;
    --panel:       #15171d;
    --panel-2:     #1d2027;
    --panel-3:     #232730;

    /* text — kit, plus --body (web) */
    --ink:         #f3f5f8;
    --body:        rgba(243, 245, 248, 0.80);
    --muted:       rgba(243, 245, 248, 0.52);
    --faint:       rgba(243, 245, 248, 0.34);

    /* accents — kit (dark-surface variants) */
    --accent:       #4c8dff;
    --accent-hover: #6ba1ff;
    --accent-soft:  rgba(76, 141, 255, 0.14);
    --purple:       #9b6bdc;

    /* Brand Blue as a fill — web */
    --brand-blue:       #0047FF;
    --brand-blue-hover: #1f5eff;
    --on-brand:         #ffffff;

    /* lines, radii, shadow — kit */
    --line:        rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.14);
    --radius-sm:   6px;
    --radius:      8px;
    --radius-lg:   12px;
    --shadow:      0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);

    /* type — kit families; Webflow's responsive heading scale where it exists */
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-head: "Rajdhani", -apple-system, sans-serif;
    --fs-h1:     var(--h1-size, 4.65rem);
    --fs-h2:     var(--h2-size, 2.83rem);
    --fs-lede:   1.1875rem;
    --fs-body:   1.0625rem;
    --fs-small:  0.9375rem;
    --fs-xs:     0.8125rem;
    --fs-eyebrow: 0.9375rem;

    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  [data-theme="light"] {
    --bg:          #f5f6f8;
    --panel:       #ffffff;
    --panel-2:     #eef0f3;
    --panel-3:     #e6e9ee;

    --ink:         #0c0d11;
    --body:        rgba(12, 13, 17, 0.80);
    --muted:       rgba(12, 13, 17, 0.60);
    --faint:       rgba(12, 13, 17, 0.40);

    --accent:       #0047FF;
    --accent-hover: #0039cc;
    --accent-soft:  rgba(0, 71, 255, 0.09);
    --purple:       #6633CC;

    --line:        rgba(12, 13, 17, 0.09);
    --line-strong: rgba(12, 13, 17, 0.16);
    --shadow:      0 1px 2px rgba(12, 13, 17, 0.06), 0 4px 16px rgba(12, 13, 17, 0.06);
  }
  /* @dmc01-tokens:end */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     SECTION FRAME
     ============================================================ */
  .dmc01-footer {
    position: relative;
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    background: var(--bg);
    padding: 28px clamp(20px, 4vw, 64px);
    border-top: 1px solid var(--line);
    font-family: var(--font-body);
    color: var(--ink);
  }
  .dmc01-footer .footer-inner {
    max-width: 1500px;
    margin: 0 auto;
  }

  /* ----- TOP ROW — brand + legal links ----- */
  .dmc01-footer .footer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .dmc01-footer .footer-brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .dmc01-footer .footer-brand:hover { opacity: 0.8; }

  /* Lockup — same geometry as the nav. No glow: the Brand
     Guidelines forbid effects on the logo. */
  .dmc01-footer .footer-logo {
    --ink-logo: var(--ink);
    width: 52px; height: 44px;
    flex-shrink: 0;
  }
  .dmc01-footer .footer-logo svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .dmc01-footer .footer-legal {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
    list-style: none;
  }
  .dmc01-footer .footer-legal a {
    font-size: var(--fs-small);
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .dmc01-footer .footer-legal a:hover { color: var(--ink); }
  .dmc01-footer .footer-legal a:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: 0 1px 0 var(--accent);
  }

  .dmc01-footer .footer-divider {
    height: 1px;
    background: var(--line);
    margin: 20px 0 18px;
  }

  /* ----- BOTTOM ROW — company info + copyright ----- */
  .dmc01-footer .footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: var(--fs-xs);
    line-height: 1.5;
    color: var(--muted);
  }
  .dmc01-footer .footer-bottom strong { color: var(--ink); font-weight: 600; }
  .dmc01-footer .footer-copyright { color: var(--faint); }

  @media (max-width: 720px) {
    .dmc01-footer { padding: 24px 20px; }
    .dmc01-footer .footer-top,
    .dmc01-footer .footer-bottom {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
  }
</style>
</head>
