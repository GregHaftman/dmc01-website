<style>
  /* ============================================================
     DMC01 · Site nav — sticky page header
     Hidden by default; slides in once the user has scrolled past
     the intro section (shown immediately on pages without one).
     Brand lockup on the left, CTA + Menu dropdown on the right.
     The dropdown groups in-page anchors, other pages, and the
     Dark / Light theme switch.

     Visual language: dmc01-ui-kit tokens. One filled Brand Blue
     CTA (the site's primary action); everything else is a hairline
     chip whose accent lives on the border and text.
     ============================================================ */

  /* @dmc01-tokens:start */
  :root {
    /* surfaces — kit */
    --bg:          #0c0d11;
    --panel:       #15171d;
    --panel-2:     #1d2027;
    --panel-3:     #232730;

    /* text — kit, plus --body (web) */
    --ink:         #f3f5f8;
    --body:        rgba(243, 245, 248, 0.80);
    --muted:       rgba(243, 245, 248, 0.52);
    --faint:       rgba(243, 245, 248, 0.34);

    /* accents — kit (dark-surface variants) */
    --accent:       #4c8dff;
    --accent-hover: #6ba1ff;
    --accent-soft:  rgba(76, 141, 255, 0.14);
    --purple:       #9b6bdc;

    /* Brand Blue as a fill — web */
    --brand-blue:       #0047FF;
    --brand-blue-hover: #1f5eff;
    --on-brand:         #ffffff;

    /* lines, radii, shadow — kit */
    --line:        rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.14);
    --radius-sm:   6px;
    --radius:      8px;
    --radius-lg:   12px;
    --shadow:      0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);

    /* type — kit families; Webflow's responsive heading scale where it exists */
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-head: "Rajdhani", -apple-system, sans-serif;
    --fs-h1:     var(--h1-size, 4.65rem);
    --fs-h2:     var(--h2-size, 2.83rem);
    --fs-lede:   1.1875rem;
    --fs-body:   1.0625rem;
    --fs-small:  0.9375rem;
    --fs-xs:     0.8125rem;
    --fs-eyebrow: 0.9375rem;

    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  [data-theme="light"] {
    --bg:          #f5f6f8;
    --panel:       #ffffff;
    --panel-2:     #eef0f3;
    --panel-3:     #e6e9ee;

    --ink:         #0c0d11;
    --body:        rgba(12, 13, 17, 0.80);
    --muted:       rgba(12, 13, 17, 0.60);
    --faint:       rgba(12, 13, 17, 0.40);

    --accent:       #0047FF;
    --accent-hover: #0039cc;
    --accent-soft:  rgba(0, 71, 255, 0.09);
    --purple:       #6633CC;

    --line:        rgba(12, 13, 17, 0.09);
    --line-strong: rgba(12, 13, 17, 0.16);
    --shadow:      0 1px 2px rgba(12, 13, 17, 0.06), 0 4px 16px rgba(12, 13, 17, 0.06);
  }
  /* @dmc01-tokens:end */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     NAV BAR
     ============================================================ */
  .dmc01-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    border-bottom: 1px solid var(--line);
    font-family: var(--font-body);
    color: var(--ink);
    /* Hidden until the user scrolls past intro. */
    opacity: 0;
    transform: translateY(-100%);
    transition: opacity 0.4s ease, transform 0.4s var(--ease);
    pointer-events: none;
  }
  .dmc01-nav.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  /* A section popup is open (set by the Product / Testimonials embeds):
     step aside so the nav never sits over the top of the popup. */
  html.dmc01-overlay-open .dmc01-nav {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
  }

  .dmc01-nav .nav-inner {
    max-width: 1700px;
    margin: 0 auto;
    padding: 12px clamp(20px, 3vw, 40px);
    display: flex;
    align-items: center;
    gap: 24px;
  }

  /* ----- BRAND ----- */
  .dmc01-nav .nav-brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .dmc01-nav .nav-brand:hover { opacity: 0.8; }

  /* Lockup from the Claude Design "DMC01 Logo Animated" nav variant.
     The JS below adds the one-time reveal and the "01" tilt. */
  .dmc01-nav .nav-logo {
    --ink-logo: var(--ink);
    width: 56px;
    height: 48px;
    flex-shrink: 0;
  }
  .dmc01-nav .nav-logo svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ----- ACTIONS ----- */
  .dmc01-nav .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  /* Primary CTA — Brand Blue as a fill, white text (correct on both
     themes). The one filled button on the page. */
  .dmc01-nav .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: var(--brand-blue);
    color: var(--on-brand);
    font-family: var(--font-body);
    font-size: var(--fs-small);
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
    border: 1px solid var(--brand-blue);
    border-radius: var(--radius);
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .dmc01-nav .nav-cta:hover {
    background: var(--brand-blue-hover);
    border-color: var(--brand-blue-hover);
    color: var(--on-brand);
  }
  .dmc01-nav .nav-cta:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .dmc01-nav .nav-cta-arrow {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.15s ease;
  }
  .dmc01-nav .nav-cta:hover .nav-cta-arrow { transform: translateX(2px); }

  /* Menu — kit hairline chip. */
  .dmc01-nav .nav-menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--fs-small);
    font-weight: 500;
    line-height: 1.2;
    cursor: pointer;
    border-radius: var(--radius);
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .dmc01-nav .nav-menu-btn:hover { border-color: var(--accent); }
  .dmc01-nav .nav-menu-btn:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .dmc01-nav .nav-menu-btn[aria-expanded="true"] {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .dmc01-nav .nav-menu-chevron {
    width: 12px; height: 12px;
    stroke: currentColor; fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s ease;
  }
  .dmc01-nav .nav-menu-btn[aria-expanded="true"] .nav-menu-chevron { transform: rotate(180deg); }

  /* ============================================================
     MENU PANEL (dropdown) — kit popover surface
     ============================================================ */
  .dmc01-nav .nav-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: clamp(20px, 3vw, 40px);
    width: 340px;
    max-width: calc(100vw - 32px);
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow), 0 18px 48px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s var(--ease);
  }
  .dmc01-nav .nav-panel.is-open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dmc01-nav .nav-panel-section { margin-bottom: 16px; }
  .dmc01-nav .nav-panel-section:last-child { margin-bottom: 0; }

  .dmc01-nav .nav-panel-eyebrow {
    font-family: var(--font-head);
    font-size: var(--fs-xs);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--line);
  }

  .dmc01-nav .nav-panel-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .dmc01-nav .nav-panel-list a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px;
    color: var(--body);
    font-size: var(--fs-small);
    font-weight: 500;
    text-decoration: none;
    border-radius: var(--radius-sm);
    transition: color 0.15s ease, background-color 0.15s ease;
  }
  .dmc01-nav .nav-panel-list a:hover,
  .dmc01-nav .nav-panel-list a:focus-visible {
    outline: none;
    color: var(--ink);
    background: var(--panel-2);
  }
  .dmc01-nav .nav-panel-list a .nav-panel-num {
    font-family: var(--font-head);
    font-size: var(--fs-small);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    min-width: 22px;
    transition: color 0.15s ease;
  }
  .dmc01-nav .nav-panel-list a:hover .nav-panel-num { color: var(--accent); }
  .dmc01-nav .nav-panel-list a .nav-panel-arrow {
    margin-left: auto;
    width: 12px; height: 12px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .dmc01-nav .nav-panel-list a:hover .nav-panel-arrow { opacity: 1; transform: translateX(0); }

  /* ============================================================
     THEME SWITCH — kit segmented control: the active option is a
     tint + accent text, never a solid block.
     ============================================================ */
  .dmc01-nav .nav-theme-toggle {
    display: flex;
    gap: 2px;
    margin-top: 8px;
    padding: 3px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .dmc01-nav .nav-theme-option {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 7px 10px;
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: var(--fs-xs);
    font-weight: 500;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
  }
  .dmc01-nav .nav-theme-option:hover { color: var(--ink); }
  .dmc01-nav .nav-theme-option:focus-visible { outline: none; border-color: var(--accent); }
  .dmc01-nav .nav-theme-option.is-active {
    color: var(--accent);
    background: var(--panel);
    border-color: color-mix(in srgb, var(--accent) 42%, transparent);
  }
  .dmc01-nav .nav-theme-icon {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px) {
    .dmc01-nav .nav-inner { padding: 10px 16px; gap: 8px; }
    .dmc01-nav .nav-logo { width: 48px; height: 42px; }
    .dmc01-nav .nav-cta { padding: 8px 12px; }
    .dmc01-nav .nav-menu-btn { padding: 8px 12px; }
    .dmc01-nav .nav-panel { right: 16px; left: 16px; width: auto; }
  }
</style>
</head>

    <div class="nav-panel-section">
      <div class="nav-panel-eyebrow">Display</div>
      <div class="nav-theme-toggle" role="radiogroup" aria-label="Theme">
        <button type="button" class="nav-theme-option" data-set-theme="dark"
                role="radio" aria-checked="true">
          <svg class="nav-theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span>Dark</span>
        </button>
        <button type="button" class="nav-theme-option" data-set-theme="light"
                role="radio" aria-checked="false">
          <svg class="nav-theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span>Light</span>
        </button>
      </div>
    </div>
  </div>
</header>

<script>
(function() {
  'use strict';

  /* Defensive against duplicates: if the nav embed is rendered more
     than once on a page (e.g. a Webflow Component placed alongside a
     direct embed), each .dmc01-nav scopes its own bindings via
     initOne(nav). A flag on the element prevents double-binding when
     the script itself is loaded twice. setTheme is module-level so
     theme toggles in any nav copy stay in sync. */

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.nav-theme-option').forEach(function(b) {
      const active = b.dataset.setTheme === theme;
      b.classList.toggle('is-active', active);
      b.setAttribute('aria-checked', active ? 'true' : 'false');
    });
    try { localStorage.setItem('dmc01-theme', theme); } catch (e) {}
  }

  /* ---------- LOGO ANIMATION ----------
     From the Claude Design "DMC01 Logo Animated" nav variant: a
     diagonal band reveals the lockup the first time the nav appears.
     After that, every 4s the "01" gives a clear but gentle tilt
     and settles back — the only recurring motion, and deliberately
     quiet. The static <svg> art in the markup is reused, so without
     JS the logo still renders as-is. */
  const NAV_TILT_EVERY = 4000;
  let navLogoUid = 0;
  function animateLogo(nav) {
    const svg = nav.querySelector('.nav-logo svg');
    const art = svg && svg.querySelector('.logo-art');
    if (!art || !svg.animate) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const vx = 56, vy = 132, vw = 452, vh = 386;
    const id = 'dmc01-nav-l' + (++navLogoUid), X0 = vx - 1.5 * vw, cx = vx + vw / 2, cy = vy + vh / 2;
    svg.innerHTML = '<defs>' +
      '<linearGradient id="' + id + 'r" gradientUnits="userSpaceOnUse" x1="' + X0 + '" y1="0" x2="' + (X0 + 3 * vw) + '" y2="0">' +
      '<stop offset="0" stop-color="#fff"></stop><stop offset=".44" stop-color="#fff"></stop>' +
      '<stop offset=".56" stop-color="#000"></stop><stop offset="1" stop-color="#000"></stop></linearGradient>' +
      '<mask id="' + id + 'm" maskUnits="userSpaceOnUse" x="' + (vx - vw) + '" y="' + (vy - vh) + '" width="' + (vw * 3) + '" height="' + (vh * 3) + '">' +
      '<g transform="rotate(18 ' + cx + ' ' + cy + ')"><rect class="rv" x="' + X0 + '" y="' + (vy - vh) + '" width="' + (3 * vw) + '" height="' + (3 * vh) + '" fill="url(#' + id + 'r)" transform="translate(' + (vw * 1.4) + ' 0)"></rect></g></mask>' +
      '</defs>' +
      '<g class="lockup" mask="url(#' + id + 'm)">' + art.outerHTML + '</g>';

    const rv = svg.querySelector('.rv'), lockup = svg.querySelector('.lockup'), one = svg.querySelector('.logo-01');
    /* Pivot the "01" on its own bottom-left corner, so it leans rather
       than spins. */
    if (one) { one.style.transformBox = 'fill-box'; one.style.transformOrigin = '0% 100%'; }
    function reveal() {
      const d = 1920;
      rv.animate([{ transform: 'translate(' + (-vw * .4) + 'px,0)' }, { transform: 'translate(' + (vw * 1.4) + 'px,0)' }],
        { duration: d, easing: 'cubic-bezier(0.45,0,0.15,1)', fill: 'backwards' });
      lockup.animate([{ filter: 'blur(3px)', opacity: .6 }, { filter: 'blur(0)', opacity: 1 }],
        { duration: d * .8, easing: 'ease-out', fill: 'backwards' });
    }
    function tilt() {
      if (!one || document.hidden || !nav.classList.contains('is-visible')) return;
      one.animate(
        [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-12deg)', offset: 0.35 }, { transform: 'rotate(0deg)' }],
        { duration: 1600, easing: 'cubic-bezier(0.45, 0, 0.2, 1)' });
    }
    /* Reveal the first time the nav becomes visible (immediately on
       pages without an intro), then start the tilt loop. */
    let started = false;
    function start() {
      if (started || !nav.classList.contains('is-visible')) return;
      started = true;
      reveal();
      setTimeout(function() { tilt(); setInterval(tilt, NAV_TILT_EVERY); }, 2200);
    }
    new MutationObserver(start).observe(nav, { attributes: true, attributeFilter: ['class'] });
    start();
  }

  function initOne(nav) {
    if (nav._dmc01Init) return;
    nav._dmc01Init = true;
    animateLogo(nav);

    const menuBtn   = nav.querySelector('.nav-menu-btn');
    const menuPanel = nav.querySelector('.nav-panel');
    if (!menuBtn || !menuPanel) {
      console.error('[DMC01-nav] menu button or panel missing.');
      return;
    }

    /* ---------- VISIBILITY ----------
       The nav appears once the intro section has been mostly scrolled
       past. We watch the .intro-section's bottom edge — when it sits
       above 40% of the viewport, the nav fades in. If there's no intro
       section on the page (e.g. Pricing or FAQ pages), the nav shows
       immediately. */
    function syncVisibility() {
      const intro = document.querySelector('.intro-section');
      let shouldShow;
      if (intro) {
        const rect = intro.getBoundingClientRect();
        shouldShow = rect.bottom < window.innerHeight * 0.4;
      } else {
        shouldShow = true;
      }
      nav.classList.toggle('is-visible', shouldShow);
    }
    syncVisibility();
    window.addEventListener('scroll', syncVisibility, { passive: true });
    window.addEventListener('resize', syncVisibility, { passive: true });

    /* ---------- MENU TOGGLE ---------- */
    function setOpen(open) {
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menuPanel.classList.toggle('is-open', open);
    }

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const isOpen = menuBtn.getAttribute('aria-expanded') === 'true';
      setOpen(!isOpen);
    });

    /* Click / tap outside → close. We bind both `mousedown` (fires
       earlier in the event cycle, harder for other handlers to
       intercept) and `click` (covers keyboard-driven activation), so
       this stays reliable even when other libraries on the Webflow
       page swallow click events. */
    function closeOnOutside(e) {
      if (!nav.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', closeOnOutside);
    document.addEventListener('click', closeOnOutside);
    document.addEventListener('touchstart', closeOnOutside, { passive: true });
    /* Esc → close. */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') setOpen(false);
    });
    /* Click any link → close (so the menu doesn't linger after nav). */
    menuPanel.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() { setOpen(false); });
    });

    /* ---------- THEME TOGGLE ---------- */
    nav.querySelectorAll('.nav-theme-option').forEach(function(b) {
      b.addEventListener('click', function() { setTheme(b.dataset.setTheme); });
    });

    console.log('[DMC01-nav] Initialised.');
  }

  function init() {
    /* Sync the theme buttons in any nav copy to whatever the FOUC
       script picked on <html data-theme="…">. */
    setTheme(document.documentElement.getAttribute('data-theme') || 'dark');
    const navs = document.querySelectorAll('.dmc01-nav');
    if (!navs.length) {
      console.error('[DMC01-nav] Could not find .dmc01-nav.');
      return;
    }
    navs.forEach(initOne);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
