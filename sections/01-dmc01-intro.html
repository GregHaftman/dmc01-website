<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DMC01 — Data Monetisation Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- FOUC-prevention: read theme from localStorage (or system pref) and
     set data-theme on <html> BEFORE first paint. The nav's toggle later
     updates this attribute and the value in storage. -->
<script>(function(){try{var t=localStorage.getItem('dmc01-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<style>
  /* ============================================================
     DMC01 · Intro hero — "Data Monetisation Concept"

     Atmosphere: a wireframe floor grid receding into the distance,
     read as a representation of space-time fabric. Vanishing point
     behind the title (~22% down from the top). Seven hair-thin
     receding lines and eight lateral lines (perspective-compressed
     depth spacing) form a trapezoidal floor that fades from bright
     at the foreground to invisible at the horizon (atmospheric
     perspective via a stroke gradient).

     The whole grid is rasterised through a three-stage SVG filter
     (feTurbulence → feGaussianBlur → feDisplacementMap). The blur
     softens the noise field before it warps the lines, so the
     deformation feels floaty rather than scratchy. baseFrequency
     animates through five keyframes over 32s with spline easing,
     keeping the wells small (~3% viewBox each) and continuously
     drifting — multiple areas of the floor float up and down with
     no two frames quite alike, like the fourth-dimension fabric
     under unseen mass.

     A very faint brand-blue halo sits at the VP — just a hint of
     light at the horizon, not a backlight that competes with the
     title. A single soft drop-shadow on the SVG gives every line a
     faint brand-blue halo so the grid feels alive without bloom.
     ============================================================ */

  :root {
    /* All variables below reference Webflow's alias block (head-alias-block.css).
       Fallbacks apply in dev preview when the alias block isn't loaded.
       Keep fallbacks in sync with brand-tokens.css.
       To change a value globally: edit Webflow → Variables, not this file. */

    /* Brand */
    --brand-blue:        var(--accent-primary, #0047FF);
    --brand-blue-hover:  var(--accent-primary-hover, #3c6ce7);

    /* Surfaces */
    --neutral-primary:   var(--bg-primary, #070708);
    --neutral-secondary: var(--bg-secondary, #161617);
    --surface-3:         #1d1e22;

    /* Typography — fonts */
    --font:              var(--font-body, "Rajdhani", system-ui, sans-serif);

    /* Typography — sizes (responsive via Webflow per-breakpoint values) */
    --t-h1-size:      var(--h1-size, 4.65rem);
    --t-h2-size:      var(--h2-size, 2.83rem);
    --t-base-size:    var(--base-font-size, 1.1rem);
    --t-lg-size:      var(--text-lg-size, 1.4rem);
    --t-xl-size:      var(--text-xl-size, 1.5rem);
    --t-eyebrow-size: var(--eyebrow-size, 1.1rem);

    /* Typography — weights & line heights */
    --w-h1:    var(--h1-weight, 600);
    --w-base:  var(--base-font-weight, 400);
    --w-bold:  var(--base-font-weight-bold, 600);
    --lh-h1:   var(--h1-line-height, 1.04em);
    --lh-base: var(--base-line-height, 1.6em);

    /* Text */
    --white:    var(--text-primary, #FFFFFF);
    --white-72: rgba(255, 255, 255, 0.88);
    --white-70: rgba(255, 255, 255, 0.86);
    --white-50: rgba(255, 255, 255, 0.62);
    --white-30: rgba(255, 255, 255, 0.30);
    --white-15: var(--border-secondary, rgba(255, 255, 255, 0.15));

    /* Brand-blue derived alphas */
    --blue-glow:  var(--accent-primary-glow, rgba(0, 71, 255, 0.55));
    --blue-faint: var(--accent-primary-faint, rgba(0, 71, 255, 0.10));
  }

  /* ============================================================
     LIGHT THEME OVERRIDES
     `data-theme="light"` on <html> flips surfaces, text and
     borders to a light palette; brand blue + glows stay (they
     read on both backgrounds). SVG illustrations keep their dark
     "device-screen" look on purpose. The nav's toggle sets this
     attribute; localStorage persists it; the inline FOUC script
     in <head> applies it before first paint.
     ============================================================ */
  [data-theme="light"] {
    --neutral-primary:   #f5f5f7;
    --neutral-secondary: #ffffff;
    --surface-3:         #ebebee;
    --white:    #070708;
    --white-72: rgba(7, 7, 8, 0.85);
    --white-70: rgba(7, 7, 8, 0.83);
    --white-50: rgba(7, 7, 8, 0.68);
    --white-30: rgba(7, 7, 8, 0.42);
    --white-15: rgba(7, 7, 8, 0.10);
  }
  /* Vignette fades to the page colour, so it needs to flip too. */
  [data-theme="light"] .intro-section::after {
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(245, 245, 247, 0.55) 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--neutral-primary);
    color: var(--white);
    font-family: var(--font);
    font-weight: var(--w-base);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     SECTION FRAME
     ============================================================ */
  .intro-section {
    position: relative;
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    /* Asymmetric padding so the two content blocks land in the
       right slots relative to the road rails (which sit at y≈22%
       and y≈78% of the section height):
         - top padding ~24vh pushes the title group BELOW the top
           rail, so the rail frames the title rather than cutting
           through it
         - bottom padding ~6vh pulls the closing line DOWN past the
           bottom rail, so "Why this matters" sits in the bottom
           strip rather than straddling the rail
       Previously both were ~10vh and the title sat above the top
       rail entirely. */
    padding: clamp(80px, 24vh, 240px) 32px clamp(48px, 6vh, 88px);
    background: var(--neutral-primary);
    overflow: hidden;
    isolation: isolate;
    min-height: 88vh;
    /* Flex column so .section-inner can flex:1 and distribute its
       children (title group at top, closing line at bottom) via
       justify-content: space-between. */
    display: flex;
    flex-direction: column;
  }

  /* Soft vignette — pulls focus to the centred content */
  .intro-section::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(7, 7, 8, 0.55) 100%);
  }

  /* ----- WIREFRAME FLOOR GRID BACKGROUND -----
     One-point perspective floor plane reading as space-time fabric.
     Vanishing point at (50, 22) in viewBox coords (50% across,
     22% down — behind the title). Seven hair-thin receding lines
     from the VP fan out to the bottom edge; eight lateral lines
     mark depth at perspective-compressed y positions, bounded by
     the outermost receding lines so the whole floor reads as a
     trapezoid receding into the distance.

     The fabric floats via a three-stage SVG filter chain:
     feTurbulence generates a fractal-noise field, feGaussianBlur
     softens it (so the deformation feels floaty rather than
     scratchy), and feDisplacementMap warps every grid line by
     sampling the smoothed field. baseFrequency animates through
     five keyframes over 32s with spline easing — small wells drift
     up and down continuously, never quite repeating, modern in
     feel. Scale 6 keeps deformation gentle relative to the wells'
     reduced size.

     A floorGrid linear gradient strokes every line, fading from
     transparent at the horizon to ~55% opacity at the foreground
     (atmospheric perspective). A subtle brand-blue radial halo
     sits at the VP — just enough to suggest light at the horizon.

     Depth cue: the perspective grid itself. "Alive" cue: the slow
     space-time deformation + a single soft drop-shadow halo on
     the SVG.

     viewBox is preserveAspectRatio="none". Stroke width is held at
     0.7px regardless of stretch via vector-effect="non-scaling-stroke"
     on the grid <g>, so the lines stay hair-thin and uniform
     whatever the section's aspect ratio. */
  .neon-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    /* Radial mask softens just the FAR corners — kept gentle on
       purpose so it doesn't suppress the rail glow at the foreground.
       Earlier iterations had this much tighter (90% / 50% black stop)
       which made the glow look weak even with aggressive drop-shadows
       because the mask was eating the bloom. */
    mask-image: radial-gradient(ellipse 130% 130% at 50% 55%, black 80%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 130% 130% at 50% 55%, black 80%, transparent 100%);
  }

  .neon-svg {
    width: 100%;
    height: 100%;
    display: block;
    /* Single soft drop-shadow on the wireframe grid — gives every
       line a faint brand-blue halo so the floor doesn't read as flat
       wire art, but stops well short of bloom that would lose the
       crispness. Static on purpose: the elegance comes from
       stillness, not motion. */
    filter: drop-shadow(0 0 3px rgba(0, 71, 255, 0.55));
  }

  /* All gradient stops share the brand colour; opacity varies per stop. */
  .neon-svg stop { stop-color: var(--brand-blue); }

  /* ============================================================
     CONTENT
     ============================================================ */
  .section-inner {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    text-align: center;
    /* Fill remaining vertical space inside .intro-section so the
       space-between distribution actually has room to push the
       closing line to the bottom. Without flex:1 the section-inner
       would collapse to its content height and both children would
       sit stacked at the top. */
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Title + description grouped — sits in the upper half of the
     section, framed by the top road rail.
     Larger gap pushes the description down past the rails' narrow
     tip near the VP, so the rails don't visually cross the
     description text. */
  .intro-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(40px, 6vh, 72px);
    width: 100%;
    max-width: 1100px;
  }

  .intro-title {
    font-size: clamp(3rem, 8vw, var(--t-h1-size));
    font-weight: var(--w-h1);
    line-height: var(--lh-h1);
    letter-spacing: -0.02em;
    color: var(--white);
    max-width: 1100px;
  }

  .intro-description {
    font-size: var(--t-xl-size);
    font-weight: var(--w-base);
    line-height: 1.55;
    color: var(--white-72);
    max-width: 640px;
  }
  .intro-description em {
    font-style: normal;
    color: var(--brand-blue);
    font-weight: var(--w-bold);
  }

  /* (.closing-line styles moved to 05-dmc01-testimonials.html — the
     reflective bookend now sits at the foot of the social-proof
     block, after the testimonial marquee.) */

  /* ----- LOGO MARK (bottom-right corner) -----
     Static signature mark hugging the bottom-right corner of the
     section. Decorative — sits outside .section-inner so it doesn't
     shift the centred content above. Hidden on narrow viewports
     (already-tight composition). */
  .intro-mark {
    position: absolute;
    bottom: clamp(6px, 1.2vw, 16px);
    right: clamp(6px, 1.2vw, 16px);
    width: clamp(64px, 8vw, 104px);
    aspect-ratio: 1;
    z-index: 3;
    pointer-events: none;
    opacity: 0.78;
    filter: drop-shadow(0 0 14px rgba(0, 71, 255, 0.35));
  }
  .intro-mark svg { width: 100%; height: 100%; display: block; }
  .intro-mark .mark-stroke {
    stroke: var(--white);
    stroke-width: 18;
    stroke-miterlimit: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* Reduced motion — SMIL animations on the road SVG are paused via
     JS in init(); nothing CSS-driven left to freeze here. */

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px) {
    .intro-section { padding: 56px 20px; min-height: 80vh; }
    .intro-main { gap: 18px; }
    /* Hide the corner mark on narrow viewports — already-tight composition. */
    .intro-mark { display: none; }
  }
</style>
</head>

<body>

<section class="intro-section" id="dmc01-intro" aria-label="DMC01 — Data Monetisation Concept">

  <!-- Wireframe floor grid as space-time fabric. Vanishing point
       at (50, 22) — behind the title. Seven hair-thin receding
       lines + eight lateral lines through an SVG displacement
       filter that warps the grid into slow organic curvature
       (areas rise and fall over a 24s cycle). -->
  <div class="neon-bg" aria-hidden="true">
    <svg class="neon-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <!-- Atmospheric perspective gradient — applied as the stroke
             colour for every grid line. Brightness ramps up from
             nothing at the horizon (y=22) to ~55% at the foreground
             (y=100). Receding lines fade along their length;
             horizontal lateral lines inherit the gradient at their
             constant y, so deeper lines are fainter than nearer ones
             — exactly how a real wireframe floor reads in atmosphere. -->
        <linearGradient id="floorGrid" gradientUnits="userSpaceOnUse"
                        x1="50" y1="22" x2="50" y2="100">
          <stop offset="0%"   stop-opacity="0"/>
          <stop offset="15%"  stop-opacity="0.10"/>
          <stop offset="50%"  stop-opacity="0.30"/>
          <stop offset="100%" stop-opacity="0.55"/>
        </linearGradient>

        <!-- Very subtle brand-blue halo at the VP. Suggests a faint
             light at the horizon, not a backlight that competes with
             the title text. -->
        <radialGradient id="introHorizon" cx="50" cy="22" r="18" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-opacity="0.10"/>
          <stop offset="60%"  stop-opacity="0.03"/>
          <stop offset="100%" stop-opacity="0"/>
        </radialGradient>

        <!-- Space-time fabric distortion. Three-stage filter chain:
               1. feTurbulence generates a fractal-noise field
               2. feGaussianBlur softens that field — smoother
                  transitions = floatier-feeling deformation
               3. feDisplacementMap warps the wireframe using the
                  smoothed field's R channel for x-displacement,
                  G channel for y-displacement
             baseFrequency animates through five keyframes over 32s
             with spline easing (ease-in-out per segment), so the
             noise field morphs continuously — multiple small wells
             drift up and down as if the floor itself is gently
             floating. The first and last keyframes match for a
             seamless loop. Scale 6 keeps deformation gentle relative
             to the now-smaller wells. -->
        <filter id="spacetime" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="fractalNoise" baseFrequency="0.025 0.028"
                        numOctaves="2" seed="7" result="noise">
            <animate attributeName="baseFrequency"
                     values="0.025 0.028; 0.028 0.024; 0.022 0.030; 0.026 0.026; 0.024 0.029; 0.025 0.028"
                     keyTimes="0; 0.2; 0.4; 0.6; 0.8; 1"
                     calcMode="spline"
                     keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
                     dur="32s" repeatCount="indefinite"/>
          </feTurbulence>
          <feGaussianBlur in="noise" stdDeviation="1.2" result="smoothNoise"/>
          <feDisplacementMap in="SourceGraphic" in2="smoothNoise" scale="6"
                             xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>

      <!-- Faint horizon glow behind the title -->
      <rect x="0" y="0" width="100" height="100" fill="url(#introHorizon)"/>

      <!-- Wireframe floor grid. Vanishing point at (50, 22) — same
           horizon as the road we replaced.

           filter="url(#spacetime)" — the whole grid is rasterised
           into the displacement filter, so the noise field warps
           every line at every point. As the noise's baseFrequency
           animates, "areas" of the floor rise and fall slowly,
           reading as the curvature of space-time fabric.

           vector-effect on the <g> holds stroke-width at 0.7px in
           CSS pixels regardless of the SVG's non-uniform stretch
           (preserveAspectRatio="none"), so the lines render as
           crisp hair-thin strokes whatever the section's aspect
           ratio. -->
      <g filter="url(#spacetime)"
         stroke="url(#floorGrid)" stroke-width="0.7" fill="none"
         vector-effect="non-scaling-stroke">

        <!-- Receding lines (depth axis). Seven lines from the VP out
             to bottom-edge x positions every 20 vbu (from -10 to 110,
             so the outer two pass off-screen and the floor reads as
             extending past the viewport). -->
        <line x1="50" y1="22" x2="-10" y2="100"/>
        <line x1="50" y1="22" x2="10"  y2="100"/>
        <line x1="50" y1="22" x2="30"  y2="100"/>
        <line x1="50" y1="22" x2="50"  y2="100"/>
        <line x1="50" y1="22" x2="70"  y2="100"/>
        <line x1="50" y1="22" x2="90"  y2="100"/>
        <line x1="50" y1="22" x2="110" y2="100"/>

        <!-- Lateral lines (width axis). Eight horizontal lines at
             perspective-compressed depths (quadratic falloff toward
             the horizon — looks like a real floor receding into the
             distance, with lines packing closer as they approach the
             VP). x extents match the outermost receding lines at
             each y, so the lateral lines stay bounded by the floor
             trapezoid. -->
        <line x1="-10"    y1="100" x2="110"    y2="100"/>
        <line x1="1.54"   y1="85"  x2="98.46"  y2="85"/>
        <line x1="11.54"  y1="72"  x2="88.46"  y2="72"/>
        <line x1="20.77"  y1="60"  x2="79.23"  y2="60"/>
        <line x1="28.46"  y1="50"  x2="71.54"  y2="50"/>
        <line x1="34.62"  y1="42"  x2="65.38"  y2="42"/>
        <line x1="40"     y1="35"  x2="60"     y2="35"/>
        <line x1="44.62"  y1="29"  x2="55.38"  y2="29"/>
      </g>
    </svg>
  </div>

  <div class="section-inner">

    <!-- Title + description grouped in .intro-main so they form a
         single block at the top of the section. The closing line
         is a separate child of .section-inner and is pushed to the
         bottom by the parent's justify-content: space-between. -->
    <div class="intro-main">
      <h1 class="intro-title">Data Monetisation Concept</h1>

      <p class="intro-description">
        DMC01 is the <em>orchestration layer</em> for monetising data assets — and charting the optimum route to market.
      </p>
    </div>

    <!-- (Closing-line moved to the testimonials section — it now sits
         at the very end of the social-proof block as the final
         reflective beat before the contact form.) -->

  </div>

  <!-- Signature mark, bottom-right. Decorative; positioned outside
       the .section-inner stack so it doesn't shift the centred content. -->
  <div class="intro-mark" aria-hidden="true">
    <svg viewBox="0 0 595.28 595.28" xmlns="http://www.w3.org/2000/svg">
      <polyline class="mark-stroke"
                points="297.17 265.57 417.4 148.9 177.87 148.9 297.19 479.32 297.17 265.57 177.87 148.9"/>
    </svg>
  </div>

</section>

<script>
(function() {
  'use strict';

  function init() {
    const root = document.querySelector('.intro-section');
    if (!root) {
      console.error('[DMC01-intro] Could not find .intro-section.');
      return;
    }

    /* prefers-reduced-motion: the gradient sweep runs on SMIL, which
       needs an explicit pause (CSS animations are honoured by the UA). */
    const prefersReduced = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      const svg = root.querySelector('.neon-svg');
      if (svg && typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    }

    console.log('[DMC01-intro] Initialised.');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
