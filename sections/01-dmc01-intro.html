<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DMC01 — Data Monetisation Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- FOUC-prevention: read theme from localStorage (or system pref) and
     set data-theme on <html> BEFORE first paint. The nav's toggle later
     updates this attribute and the value in storage. -->
<script>(function(){try{var t=localStorage.getItem('dmc01-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<style>
  /* ============================================================
     DMC01 · Intro hero — "Data Monetisation Concept"

     Atmosphere: a one-point perspective road read as a runway at
     night. Vanishing point behind the DMC01 logo at the top centre.
     Two pencil-thin lane rails diverge from the VP outward to the
     bottom corners; their actual polygon shapes are slim (top
     0.20 vbu, bottom 2.5 vbu), and a four-layer drop-shadow stack
     on the SVG surrounds them with substantial fluorescent bloom.

     The bloom breathes — animates over a 7s ease-in-out cycle
     between a bright peak and a dim trough, so the rails grow
     brighter and then fade back down continuously. Smoother and
     slower than earlier flicker / flare experiments; reads as
     fabric breathing rather than interference.

     Section min-height is 100vh so the intro fills the viewport
     completely on desktop — the next section (Product / orbital)
     never peeks above the fold.

     Content stack inside the rails (from top to bottom):
       1. DMC01 sigil (logo)            — top centre, framed by VP
       2. "Data Monetisation Concept"   — title
       3. Sub-heading                   — compiling-strategy line

     A very faint brand-blue halo sits at the VP — just a hint of
     light at the horizon, not a backlight that competes with the
     logo or title.
     ============================================================ */

  :root {
    /* All variables below reference Webflow's alias block (head-alias-block.css).
       Fallbacks apply in dev preview when the alias block isn't loaded.
       Keep fallbacks in sync with brand-tokens.css.
       To change a value globally: edit Webflow → Variables, not this file. */

    /* Brand */
    --brand-blue:        var(--accent-primary, #0047FF);
    --brand-blue-hover:  var(--accent-primary-hover, #3c6ce7);

    /* Surfaces */
    --neutral-primary:   var(--bg-primary, #070708);
    --neutral-secondary: var(--bg-secondary, #161617);
    --surface-3:         #1d1e22;

    /* Typography — fonts */
    --font:              var(--font-body, "Rajdhani", system-ui, sans-serif);

    /* Typography — sizes (responsive via Webflow per-breakpoint values) */
    --t-h1-size:      var(--h1-size, 4.65rem);
    --t-h2-size:      var(--h2-size, 2.83rem);
    --t-base-size:    var(--base-font-size, 1.1rem);
    --t-lg-size:      var(--text-lg-size, 1.4rem);
    --t-xl-size:      var(--text-xl-size, 1.5rem);
    --t-eyebrow-size: var(--eyebrow-size, 1.1rem);

    /* Typography — weights & line heights */
    --w-h1:    var(--h1-weight, 600);
    --w-base:  var(--base-font-weight, 400);
    --w-bold:  var(--base-font-weight-bold, 600);
    --lh-h1:   var(--h1-line-height, 1.04em);
    --lh-base: var(--base-line-height, 1.6em);

    /* Text */
    --white:    var(--text-primary, #FFFFFF);
    --white-72: rgba(255, 255, 255, 0.88);
    --white-70: rgba(255, 255, 255, 0.86);
    --white-50: rgba(255, 255, 255, 0.62);
    --white-30: rgba(255, 255, 255, 0.30);
    --white-15: var(--border-secondary, rgba(255, 255, 255, 0.15));

    /* Brand-blue derived alphas */
    --blue-glow:  var(--accent-primary-glow, rgba(0, 71, 255, 0.55));
    --blue-faint: var(--accent-primary-faint, rgba(0, 71, 255, 0.10));
  }

  /* ============================================================
     LIGHT THEME OVERRIDES
     `data-theme="light"` on <html> flips surfaces, text and
     borders to a light palette; brand blue + glows stay (they
     read on both backgrounds). SVG illustrations keep their dark
     "device-screen" look on purpose. The nav's toggle sets this
     attribute; localStorage persists it; the inline FOUC script
     in <head> applies it before first paint.
     ============================================================ */
  [data-theme="light"] {
    --neutral-primary:   #f5f5f7;
    --neutral-secondary: #ffffff;
    --surface-3:         #ebebee;
    --white:    #070708;
    --white-72: rgba(7, 7, 8, 0.85);
    --white-70: rgba(7, 7, 8, 0.83);
    --white-50: rgba(7, 7, 8, 0.68);
    --white-30: rgba(7, 7, 8, 0.42);
    --white-15: rgba(7, 7, 8, 0.10);
  }
  /* Vignette fades to the page colour, so it needs to flip too. */
  [data-theme="light"] .intro-section::after {
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(245, 245, 247, 0.55) 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--neutral-primary);
    color: var(--white);
    font-family: var(--font);
    font-weight: var(--w-base);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     SECTION FRAME
     ============================================================ */
  .intro-section {
    position: relative;
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    /* Asymmetric padding so the two content blocks land in the
       right slots relative to the road rails (which sit at y≈22%
       and y≈78% of the section height):
         - top padding ~24vh pushes the title group BELOW the top
           rail, so the rail frames the title rather than cutting
           through it
         - bottom padding ~6vh pulls the closing line DOWN past the
           bottom rail, so "Why this matters" sits in the bottom
           strip rather than straddling the rail
       Previously both were ~10vh and the title sat above the top
       rail entirely. */
    padding: clamp(120px, 26vh, 280px) 32px clamp(48px, 8vh, 120px);
    background: var(--neutral-primary);
    overflow: hidden;
    isolation: isolate;
    /* 100vh so the intro fills the viewport completely on desktop —
       the next section (Product / orbital) never peeks above the
       fold. User has to scroll to reach it. */
    min-height: 100vh;
    /* Flex column so .section-inner can flex:1 and distribute its
       children (title group at top, closing line at bottom) via
       justify-content: space-between. */
    display: flex;
    flex-direction: column;
  }

  /* Soft vignette — pulls focus to the centred content */
  .intro-section::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(7, 7, 8, 0.55) 100%);
  }

  /* ----- RUNWAY-LIGHT ROAD BACKGROUND -----
     One-point perspective road reading as a runway at night.
     Vanishing point at (50, 22) in viewBox coords (50% across,
     22% down — behind the title). Two pencil-thin lane-rail
     polygons diverge from the VP outward to the bottom corners
     (-13.25..-10.75, 100) and (110.75..113.25, 100); they're
     deliberately slim (top 0.20 vbu, bottom 2.5 vbu) so almost all
     the visual presence comes from the four-layer drop-shadow
     bloom on .neon-svg, not from the rail polygons themselves —
     the rails read as bright glowing strips, not solid bars.

     A introRail linear gradient fills the rails, ramping up
     steeply from invisible at the VP to fully saturated by 60%
     of the way down. A very subtle brand-blue radial halo sits
     at the VP — just enough to suggest light at the horizon.

     Continuous and static — no animation. Earlier iterations
     animated the glow (intermittent flares, fluorescent flicker,
     space-time distortion of a wireframe floor); all of them read
     as too active. Continuous bloom is the brief. */
  .neon-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    /* Radial mask softens just the FAR corners — kept gentle on
       purpose so it doesn't suppress the rail glow at the foreground.
       Earlier iterations had this much tighter (90% / 50% black stop)
       which made the glow look weak even with aggressive drop-shadows
       because the mask was eating the bloom. */
    mask-image: radial-gradient(ellipse 130% 130% at 50% 55%, black 80%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 130% 130% at 50% 55%, black 80%, transparent 100%);
  }

  .neon-svg {
    width: 100%;
    height: 100%;
    display: block;
    /* Runway-light bloom that breathes. Four stacked drop-shadows
       (hot core → tight halo → mid bloom → wide ambient) animate
       between a dim baseline and a bright peak over a 7s ease-in-out
       cycle, so the rails grow brighter and then fade back down
       continuously. Smoother and slower than the earlier "flicker"
       experiments — reads as the fabric breathing, not as
       interference.

       Stacked drop-shadows are GPU-shader-heavy on large SVGs;
       if perf is an issue on weaker devices, drop the widest 95px
       layer first. */
    animation: railBreathe 7s ease-in-out infinite;
    /* Initial state matches the bright peak so the first paint
       shows the rails fully glowing, not mid-breath. */
    filter:
      drop-shadow(0 0 5px   rgba(0, 71, 255, 1.0))
      drop-shadow(0 0 16px  rgba(0, 71, 255, 0.90))
      drop-shadow(0 0 42px  rgba(0, 71, 255, 0.65))
      drop-shadow(0 0 95px  rgba(0, 71, 255, 0.40));
  }

  /* Bright (peak) ↔ dim (trough). Both keyframes carry the same
     four drop-shadow layers, so the browser interpolates each
     layer's blur radius and alpha smoothly across the cycle.
     0%/100% = peak (bright), 50% = trough (dim) — symmetric, so
     the glow rises and fades evenly. */
  @keyframes railBreathe {
    0%, 100% {
      filter:
        drop-shadow(0 0 5px   rgba(0, 71, 255, 1.0))
        drop-shadow(0 0 16px  rgba(0, 71, 255, 0.90))
        drop-shadow(0 0 42px  rgba(0, 71, 255, 0.65))
        drop-shadow(0 0 95px  rgba(0, 71, 255, 0.40));
    }
    50% {
      filter:
        drop-shadow(0 0 3px   rgba(0, 71, 255, 0.55))
        drop-shadow(0 0 10px  rgba(0, 71, 255, 0.45))
        drop-shadow(0 0 26px  rgba(0, 71, 255, 0.28))
        drop-shadow(0 0 60px  rgba(0, 71, 255, 0.16));
    }
  }

  /* Honour reduced-motion preference — pin the rails at the bright
     peak. */
  @media (prefers-reduced-motion: reduce) {
    .neon-svg { animation: none; }
  }

  /* All gradient stops share the brand colour; opacity varies per stop. */
  .neon-svg stop { stop-color: var(--brand-blue); }

  /* ============================================================
     CONTENT
     ============================================================ */
  .section-inner {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    text-align: center;
    /* Fill remaining vertical space inside .intro-section so the
       space-between distribution actually has room to push the
       closing line to the bottom. Without flex:1 the section-inner
       would collapse to its content height and both children would
       sit stacked at the top. */
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Title + description grouped — sits in the upper half of the
     section, framed by the top road rail.
     Larger gap pushes the description down past the rails' narrow
     tip near the VP, so the rails don't visually cross the
     description text. */
  .intro-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(40px, 6vh, 72px);
    width: 100%;
    max-width: 1100px;
  }

  .intro-title {
    font-size: clamp(3rem, 8vw, var(--t-h1-size));
    font-weight: var(--w-h1);
    line-height: var(--lh-h1);
    letter-spacing: -0.02em;
    color: var(--white);
    max-width: 1100px;
    /* Extra breathing room above the title — adds to the .intro-main
       flex gap so the logo sits a touch further above the title +
       description block (the description follows the title in the
       flex column so it inherits the shift). */
    margin-top: clamp(16px, 3vh, 32px);
  }

  .intro-description {
    font-size: var(--t-xl-size);
    font-weight: var(--w-base);
    line-height: 1.55;
    color: var(--white-72);
    max-width: 640px;
  }
  .intro-description em {
    font-style: normal;
    color: var(--brand-blue);
    font-weight: var(--w-bold);
  }

  /* (.closing-line styles moved to 05-dmc01-testimonials.html — the
     reflective bookend now sits at the foot of the social-proof
     block, after the testimonial marquee.) */

  /* ----- LOGO MARK (top-centre, in the content stack) -----
     Sits as the FIRST element of .intro-main, above the title and
     description. Centred horizontally between the two perspective
     rails (which converge at the VP just behind it). Decorative
     signature; size scales with viewport. */
  .intro-mark {
    width: clamp(96px, 12vw, 160px);
    aspect-ratio: 1;
    flex-shrink: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(0, 71, 255, 0.45));
  }
  .intro-mark svg { width: 100%; height: 100%; display: block; }
  .intro-mark .mark-stroke {
    stroke: var(--white);
    stroke-width: 18;
    stroke-miterlimit: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* Reduced motion — SMIL animations on the road SVG are paused via
     JS in init(); nothing CSS-driven left to freeze here. */

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px) {
    .intro-section { padding: 56px 20px; min-height: 95vh; }
    .intro-main { gap: 24px; }
    /* Logo stays visible on mobile (it's now the first content element),
       but smaller. */
    .intro-mark { width: 80px; }
  }
</style>
</head>

<body>

<section class="intro-section" id="dmc01-intro" aria-label="DMC01 — Data Monetisation Concept">

  <!-- Two perspective lane rails as runway lights. Vanishing point
       at (50, 22) — behind the title. Pencil-thin polygons + a
       four-layer drop-shadow bloom on the SVG = bright continuous
       fluorescent glow. No animation. -->
  <div class="neon-bg" aria-hidden="true">
    <svg class="neon-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <!-- Lane-rail gradient. Ramps up steeply from invisible at
             the horizon (y=22) to fully saturated brand-blue across
             most of the rail's length. Steep on purpose: this is a
             runway light, not a fading line — bright and present
             from the foreground all the way back to almost the VP. -->
        <linearGradient id="introRail" gradientUnits="userSpaceOnUse"
                        x1="50" y1="22" x2="50" y2="100">
          <stop offset="0%"   stop-opacity="0"/>
          <stop offset="10%"  stop-opacity="0.40"/>
          <stop offset="30%"  stop-opacity="0.80"/>
          <stop offset="60%"  stop-opacity="1"/>
          <stop offset="100%" stop-opacity="1"/>
        </linearGradient>

        <!-- Very subtle brand-blue halo at the VP. Suggests a faint
             light at the horizon, not a backlight that competes with
             the title text. -->
        <radialGradient id="introHorizon" cx="50" cy="22" r="18" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-opacity="0.10"/>
          <stop offset="60%"  stop-opacity="0.03"/>
          <stop offset="100%" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Faint horizon glow behind the title -->
      <rect x="0" y="0" width="100" height="100" fill="url(#introHorizon)"/>

      <!-- Two perspective lane rails as runway lights. Both polygons
           are slim (top 0.20 vbu, bottom 2.5 vbu) so the actual rail
           shapes are pencil-thin; the four-layer drop-shadow stack
           on .neon-svg is what gives them substantial fluorescent
           bloom around the slim cores. Continuous static glow — no
           animation. -->

      <!-- Left lane rail: VP (50, 22) → bottom-left, centred on x=-12.
           Top 0.20 vbu, bottom 2.5 vbu. -->
      <polygon fill="url(#introRail)"
               points="49.9,22 50.1,22 -10.75,100 -13.25,100"/>

      <!-- Right lane rail: mirror, centred on x=112. -->
      <polygon fill="url(#introRail)"
               points="49.9,22 50.1,22 113.25,100 110.75,100"/>
    </svg>
  </div>

  <div class="section-inner">

    <!-- Logo + title + description grouped in .intro-main so they
         form a single centred stack. The logo is the first element,
         sitting at the top centre between the rails (with the VP
         right behind it). Title and description follow underneath
         in order. -->
    <div class="intro-main">
      <!-- Signature mark — now top-centre, inside the content stack. -->
      <div class="intro-mark" aria-hidden="true">
        <svg viewBox="0 0 595.28 595.28" xmlns="http://www.w3.org/2000/svg">
          <polyline class="mark-stroke"
                    points="297.17 265.57 417.4 148.9 177.87 148.9 297.19 479.32 297.17 265.57 177.87 148.9"/>
        </svg>
      </div>

      <h1 class="intro-title">Data Monetisation Concept</h1>

      <p class="intro-description">
        DMC01 <em>makes it work</em> by aligning what you sell, how you deliver it and how your clients use it.
      </p>
    </div>

    <!-- (Closing-line moved to the testimonials section — it now sits
         at the very end of the social-proof block as the final
         reflective beat before the contact form.) -->

  </div>

</section>

<script>
(function() {
  'use strict';

  function init() {
    const root = document.querySelector('.intro-section');
    if (!root) {
      console.error('[DMC01-intro] Could not find .intro-section.');
      return;
    }

    /* prefers-reduced-motion: the gradient sweep runs on SMIL, which
       needs an explicit pause (CSS animations are honoured by the UA). */
    const prefersReduced = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      const svg = root.querySelector('.neon-svg');
      if (svg && typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    }

    console.log('[DMC01-intro] Initialised.');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
