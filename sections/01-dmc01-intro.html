<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DMC01 — Data Monetisation Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- FOUC-prevention: read theme from localStorage (or system pref) and
     set data-theme on <html> BEFORE first paint. The nav's toggle later
     updates this attribute and the value in storage. -->
<script>(function(){try{var t=localStorage.getItem('dmc01-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<style>
  /* ============================================================
     DMC01 · Intro hero — "Data Monetisation Concept"

     Atmosphere: a subtle BTTF homage. Faint horizontal road tracks
     drift across the background, and a barely-perceptible flux pulse
     runs through the three-prong DMC01 mark. Both effects are
     intentionally low-contrast — content stays the focus.
     ============================================================ */

  :root {
    /* All variables below reference Webflow's alias block (head-alias-block.css).
       Fallbacks apply in dev preview when the alias block isn't loaded.
       Keep fallbacks in sync with brand-tokens.css.
       To change a value globally: edit Webflow → Variables, not this file. */

    /* Brand */
    --brand-blue:        var(--accent-primary, #0047FF);
    --brand-blue-hover:  var(--accent-primary-hover, #3c6ce7);

    /* Surfaces */
    --neutral-primary:   var(--bg-primary, #070708);
    --neutral-secondary: var(--bg-secondary, #161617);
    --surface-3:         #1d1e22;

    /* Typography — fonts */
    --font:              var(--font-body, "Rajdhani", system-ui, sans-serif);

    /* Typography — sizes (responsive via Webflow per-breakpoint values) */
    --t-h1-size:      var(--h1-size, 5.65rem);
    --t-h2-size:      var(--h2-size, 2.83rem);
    --t-base-size:    var(--base-font-size, 1rem);
    --t-lg-size:      var(--text-lg-size, 1.1rem);
    --t-xl-size:      var(--text-xl-size, 1.2rem);
    --t-eyebrow-size: var(--eyebrow-size, 0.8rem);

    /* Typography — weights & line heights */
    --w-h1:    var(--h1-weight, 600);
    --w-base:  var(--base-font-weight, 400);
    --w-bold:  var(--base-font-weight-bold, 600);
    --lh-h1:   var(--h1-line-height, 1.04em);
    --lh-base: var(--base-line-height, 1.6em);

    /* Text */
    --white:    var(--text-primary, #FFFFFF);
    --white-72: rgba(255, 255, 255, 0.72);
    --white-70: rgba(255, 255, 255, 0.70);
    --white-50: rgba(255, 255, 255, 0.50);
    --white-30: rgba(255, 255, 255, 0.30);
    --white-15: var(--border-secondary, rgba(255, 255, 255, 0.15));

    /* Brand-blue derived alphas */
    --blue-glow:  var(--accent-primary-glow, rgba(0, 71, 255, 0.55));
    --blue-faint: var(--accent-primary-faint, rgba(0, 71, 255, 0.10));
  }

  /* ============================================================
     LIGHT THEME OVERRIDES
     `data-theme="light"` on <html> flips surfaces, text and
     borders to a light palette; brand blue + glows stay (they
     read on both backgrounds). SVG illustrations keep their dark
     "device-screen" look on purpose. The nav's toggle sets this
     attribute; localStorage persists it; the inline FOUC script
     in <head> applies it before first paint.
     ============================================================ */
  [data-theme="light"] {
    --neutral-primary:   #f5f5f7;
    --neutral-secondary: #ffffff;
    --surface-3:         #ebebee;
    --white:    #070708;
    --white-72: rgba(7, 7, 8, 0.72);
    --white-70: rgba(7, 7, 8, 0.70);
    --white-50: rgba(7, 7, 8, 0.55);
    --white-30: rgba(7, 7, 8, 0.42);
    --white-15: rgba(7, 7, 8, 0.10);
  }
  /* Vignette fades to the page colour, so it needs to flip too. */
  [data-theme="light"] .intro-section::after {
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(245, 245, 247, 0.55) 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--neutral-primary);
    color: var(--white);
    font-family: var(--font);
    font-weight: var(--w-base);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     SECTION FRAME
     ============================================================ */
  .intro-section {
    position: relative;
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    padding: clamp(72px, 10vh, 120px) 32px clamp(72px, 10vh, 120px);
    background: var(--neutral-primary);
    overflow: hidden;
    isolation: isolate;
    min-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Soft vignette — pulls focus to the centred content */
  .intro-section::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(7, 7, 8, 0.55) 100%);
  }

  /* ----- ROAD RAILS BACKGROUND -----
     Two parallel rails framing the content top/bottom. Each rail is
     a *spindle polygon* — thick in the middle, tapering to a thin tip
     at both edges. That's the 3D cue: the road has mass at the centre
     (where the content sits) and recedes into the distance at both
     ends. The polygon is filled by a linear gradient running along
     the rail axis; the gradient has a soft bell peak that sweeps via
     SMIL `animateTransform`. Counter-flow on the two rails. The peak
     is past the polygon's far edge at both animation endpoints, so
     the loop reset is invisible. */
  .neon-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    /* Radial mask softens the rails' far horizontal edges. */
    mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, black 35%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, black 35%, transparent 100%);
  }

  .neon-svg {
    width: 100%;
    height: 100%;
    display: block;
    /* Halo follows fill alpha — bright peak blooms, dim baseline barely
       glows. Drop-shadow lives in pixel space so the halo stays uniform
       even though the SVG is non-uniformly stretched. */
    filter: drop-shadow(0 0 6px rgba(0, 71, 255, 0.55));
  }

  /* All gradient stops share the brand colour; opacity varies per stop. */
  .neon-svg stop { stop-color: var(--brand-blue); }

  /* ============================================================
     CONTENT
     ============================================================ */
  .section-inner {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .intro-title {
    font-size: clamp(3rem, 8vw, var(--t-h1-size));
    font-weight: var(--w-h1);
    line-height: var(--lh-h1);
    letter-spacing: -0.02em;
    color: var(--white);
    max-width: 1100px;
  }

  .intro-description {
    font-size: var(--t-xl-size);
    font-weight: var(--w-base);
    line-height: 1.55;
    color: var(--white-72);
    max-width: 640px;
  }
  .intro-description em {
    font-style: normal;
    color: var(--brand-blue);
    font-weight: var(--w-bold);
  }

  /* ----- CLOSING LINE — reflective bookend below the description.
     Moved up from the orbital section: it's the WHY beneath the
     headline + lede, and reads as the section's quiet finishing
     thought rather than a decoration on a different page. */
  .closing-line {
    margin-top: clamp(24px, 4vh, 48px);
    padding-top: 32px;
    border-top: 1px solid rgba(25, 75, 205, 0.2);
    text-align: center;
    width: 100%;
    max-width: 900px;
  }
  .closing-line-eyebrow {
    font-size: var(--t-eyebrow-size);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--brand-blue);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .closing-line-text {
    font-size: var(--t-xl-size);
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--white-72);
    margin: 0 auto;
  }
  .closing-line-text em {
    font-style: normal;
    color: var(--brand-blue);
    font-weight: 600;
  }

  /* Reduced motion — SMIL animations on the road SVG are paused via
     JS in init(); nothing CSS-driven left to freeze here. */

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px) {
    .intro-section { padding: 56px 20px; min-height: 80vh; }
    .section-inner { gap: 18px; }
    .closing-line-text { font-size: var(--t-lg-size); }
  }
</style>
</head>

<body>

<section class="intro-section" id="dmc01-intro" aria-label="DMC01 — Data Monetisation Concept">

  <!-- Road rails: two parallel spindle polygons (thick mid, thin tips)
       framing the content above and below. Each is filled by a
       gradient whose bell peak sweeps along the rail axis via SMIL.
       Counter-flow on rail A vs B. -->
  <div class="neon-bg" aria-hidden="true">
    <svg class="neon-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <!-- Gradient axes match the rails' centre lines: A at y=32 (mid),
             B at y=68 (mid). Translating ±80 in x slides the peak past
             both polygon ends, so the loop reset is invisible. -->
        <linearGradient id="introRailA" gradientUnits="userSpaceOnUse"
                        x1="-5" y1="26" x2="105" y2="18">
          <stop offset="0"    stop-opacity="0.05"/>
          <stop offset="0.32" stop-opacity="0.05"/>
          <stop offset="0.42" stop-opacity="0.30"/>
          <stop offset="0.50" stop-opacity="0.85"/>
          <stop offset="0.58" stop-opacity="0.30"/>
          <stop offset="0.68" stop-opacity="0.05"/>
          <stop offset="1"    stop-opacity="0.05"/>
          <animateTransform attributeName="gradientTransform" type="translate"
                            values="-80 0; 80 0" dur="9s" repeatCount="indefinite"/>
        </linearGradient>
        <linearGradient id="introRailB" gradientUnits="userSpaceOnUse"
                        x1="-5" y1="82" x2="105" y2="74">
          <stop offset="0"    stop-opacity="0.05"/>
          <stop offset="0.32" stop-opacity="0.05"/>
          <stop offset="0.42" stop-opacity="0.30"/>
          <stop offset="0.50" stop-opacity="0.85"/>
          <stop offset="0.58" stop-opacity="0.30"/>
          <stop offset="0.68" stop-opacity="0.05"/>
          <stop offset="1"    stop-opacity="0.05"/>
          <animateTransform attributeName="gradientTransform" type="translate"
                            values="80 0; -80 0" dur="11s" repeatCount="indefinite"/>
        </linearGradient>
      </defs>

      <!-- Spindle polygons. 14 vertices each: 7 along the top edge
           (left → right) then 7 along the bottom edge (right → left).
           Thickness profile is parabolic — peak 1.0 viewBox unit at
           the centre, tapering to 0.2 at both ends. Centre lines now
           run from (-5, 26)→(105, 18) and (-5, 82)→(105, 74) so the
           rails sit at y≈22% and y≈78% — wider apart, more breathing
           room around the content. Slope held at -0.073. -->
      <polygon fill="url(#introRailA)"
               points="-5,25.9 15,24.21 35,22.62 50,21.5 65,20.44 85,19.11 105,17.9 105,18.1 85,19.79 65,21.38 50,22.5 35,23.56 15,24.89 -5,26.1"/>
      <polygon fill="url(#introRailB)"
               points="-5,81.9 15,80.21 35,78.62 50,77.5 65,76.44 85,75.11 105,73.9 105,74.1 85,75.79 65,77.38 50,78.5 35,79.56 15,80.89 -5,82.1"/>
    </svg>
  </div>

  <div class="section-inner">

    <h1 class="intro-title">Data Monetisation Concept</h1>

    <p class="intro-description">
      DMC01 is the <em>orchestration layer</em> for monetising data assets — and charting the optimum route to market.
    </p>

    <!-- Closing-line — moved up from the orbital section; sits as
         the reflective bookend beneath the description. -->
    <div class="closing-line">
      <div class="closing-line-eyebrow">Why this matters</div>
      <p class="closing-line-text">Great things are built by people <em>fascinated</em> with how they work.</p>
    </div>

  </div>

</section>

<script>
(function() {
  'use strict';

  function init() {
    const root = document.querySelector('.intro-section');
    if (!root) {
      console.error('[DMC01-intro] Could not find .intro-section.');
      return;
    }

    /* prefers-reduced-motion: the gradient sweep runs on SMIL, which
       needs an explicit pause (CSS animations are honoured by the UA). */
    const prefersReduced = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      const svg = root.querySelector('.neon-svg');
      if (svg && typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    }

    console.log('[DMC01-intro] Initialised.');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
