<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DMC01 — Data Monetisation Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- FOUC-prevention: read theme from localStorage (or system pref) and
     set data-theme on <html> BEFORE first paint. The nav's toggle later
     updates this attribute and the value in storage. -->
<script>(function(){try{var t=localStorage.getItem('dmc01-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<style>
  /* ============================================================
     DMC01 · Intro hero — "Data Monetisation Concept"

     Atmosphere: a one-point perspective road. The vanishing point
     sits behind the title (~22% down from the top), with two slim
     lane rails diverging out to the bottom corners. A soft brand-
     blue halo at the vanishing point gives the title a quiet
     backlight.

     The rails sit at a near-invisible baseline opacity — you can
     almost miss them. Once every ~9 seconds, a layered drop-shadow
     bloom flares up for a beat, the rails pop into view with strong
     contrast, and then they fade back to subtle. Cinematic reveal
     pattern — think of a dark scene where something appears briefly
     before melting back into the dark. See @keyframes railBreathe.

     There is no centre line. Earlier iterations tried perspective-
     scaled rect dashes and then a stroke-dashed line; both felt too
     busy and visually competed with the closing-line text. The
     rails alone carry the depth cue.

     prefers-reduced-motion is honoured by disabling the breathing
     animation (rails hold the dim baseline glow).
     ============================================================ */

  :root {
    /* All variables below reference Webflow's alias block (head-alias-block.css).
       Fallbacks apply in dev preview when the alias block isn't loaded.
       Keep fallbacks in sync with brand-tokens.css.
       To change a value globally: edit Webflow → Variables, not this file. */

    /* Brand */
    --brand-blue:        var(--accent-primary, #0047FF);
    --brand-blue-hover:  var(--accent-primary-hover, #3c6ce7);

    /* Surfaces */
    --neutral-primary:   var(--bg-primary, #070708);
    --neutral-secondary: var(--bg-secondary, #161617);
    --surface-3:         #1d1e22;

    /* Typography — fonts */
    --font:              var(--font-body, "Rajdhani", system-ui, sans-serif);

    /* Typography — sizes (responsive via Webflow per-breakpoint values) */
    --t-h1-size:      var(--h1-size, 4.65rem);
    --t-h2-size:      var(--h2-size, 2.83rem);
    --t-base-size:    var(--base-font-size, 1.1rem);
    --t-lg-size:      var(--text-lg-size, 1.4rem);
    --t-xl-size:      var(--text-xl-size, 1.5rem);
    --t-eyebrow-size: var(--eyebrow-size, 1.1rem);

    /* Typography — weights & line heights */
    --w-h1:    var(--h1-weight, 600);
    --w-base:  var(--base-font-weight, 400);
    --w-bold:  var(--base-font-weight-bold, 600);
    --lh-h1:   var(--h1-line-height, 1.04em);
    --lh-base: var(--base-line-height, 1.6em);

    /* Text */
    --white:    var(--text-primary, #FFFFFF);
    --white-72: rgba(255, 255, 255, 0.88);
    --white-70: rgba(255, 255, 255, 0.86);
    --white-50: rgba(255, 255, 255, 0.62);
    --white-30: rgba(255, 255, 255, 0.30);
    --white-15: var(--border-secondary, rgba(255, 255, 255, 0.15));

    /* Brand-blue derived alphas */
    --blue-glow:  var(--accent-primary-glow, rgba(0, 71, 255, 0.55));
    --blue-faint: var(--accent-primary-faint, rgba(0, 71, 255, 0.10));
  }

  /* ============================================================
     LIGHT THEME OVERRIDES
     `data-theme="light"` on <html> flips surfaces, text and
     borders to a light palette; brand blue + glows stay (they
     read on both backgrounds). SVG illustrations keep their dark
     "device-screen" look on purpose. The nav's toggle sets this
     attribute; localStorage persists it; the inline FOUC script
     in <head> applies it before first paint.
     ============================================================ */
  [data-theme="light"] {
    --neutral-primary:   #f5f5f7;
    --neutral-secondary: #ffffff;
    --surface-3:         #ebebee;
    --white:    #070708;
    --white-72: rgba(7, 7, 8, 0.85);
    --white-70: rgba(7, 7, 8, 0.83);
    --white-50: rgba(7, 7, 8, 0.68);
    --white-30: rgba(7, 7, 8, 0.42);
    --white-15: rgba(7, 7, 8, 0.10);
  }
  /* Vignette fades to the page colour, so it needs to flip too. */
  [data-theme="light"] .intro-section::after {
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(245, 245, 247, 0.55) 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--neutral-primary);
    color: var(--white);
    font-family: var(--font);
    font-weight: var(--w-base);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     SECTION FRAME
     ============================================================ */
  .intro-section {
    position: relative;
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    /* Asymmetric padding so the two content blocks land in the
       right slots relative to the road rails (which sit at y≈22%
       and y≈78% of the section height):
         - top padding ~24vh pushes the title group BELOW the top
           rail, so the rail frames the title rather than cutting
           through it
         - bottom padding ~6vh pulls the closing line DOWN past the
           bottom rail, so "Why this matters" sits in the bottom
           strip rather than straddling the rail
       Previously both were ~10vh and the title sat above the top
       rail entirely. */
    padding: clamp(80px, 24vh, 240px) 32px clamp(48px, 6vh, 88px);
    background: var(--neutral-primary);
    overflow: hidden;
    isolation: isolate;
    min-height: 88vh;
    /* Flex column so .section-inner can flex:1 and distribute its
       children (title group at top, closing line at bottom) via
       justify-content: space-between. */
    display: flex;
    flex-direction: column;
  }

  /* Soft vignette — pulls focus to the centred content */
  .intro-section::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(7, 7, 8, 0.55) 100%);
  }

  /* ----- PERSPECTIVE ROAD BACKGROUND -----
     One-point perspective. Vanishing point at (50, 22) in viewBox
     coords (50% across, 22% down — sitting behind the title). Two
     lane-rail polygons diverge from the VP outward to the bottom
     corners (-14, 100) and (114, 100). A radial brand-blue halo at
     the VP backlights the title.

     No centre dashes, no animation. The depth cue is the rails'
     perspective shape; the "alive" cue is a static layered drop-
     shadow glow on the SVG.

     viewBox is preserveAspectRatio="none", so x/y units stretch with
     the section's aspect ratio. The road is tuned for a typical hero
     aspect (~16:9 to ~3:1); on extreme ratios it'll look slightly
     foreshortened but still readable. */
  .neon-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    /* Radial mask softens just the FAR corners — kept gentle on
       purpose so it doesn't suppress the rail glow at the foreground.
       Earlier iterations had this much tighter (90% / 50% black stop)
       which made the glow look weak even with aggressive drop-shadows
       because the mask was eating the bloom. */
    mask-image: radial-gradient(ellipse 130% 130% at 50% 55%, black 80%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 130% 130% at 50% 55%, black 80%, transparent 100%);
  }

  .neon-svg {
    width: 100%;
    height: 100%;
    display: block;
    /* Cinematic breathing glow — most of the time the rails sit at a
       barely-there baseline (you can almost miss them), then once per
       cycle the drop-shadow bloom flares up briefly so the rails pop
       into view with strong contrast before fading back to subtle.
       Think of a dark scene in a film where something quietly reveals
       itself for a beat. See @keyframes railBreathe below for the
       intensity curve. */
    animation: railBreathe 9s ease-in-out infinite;
    /* Initial state matches the keyframe baseline so the first paint
       isn't a sudden flare. */
    filter:
      drop-shadow(0 0 2px  rgba(0, 71, 255, 0.30))
      drop-shadow(0 0 6px  rgba(0, 71, 255, 0.12))
      drop-shadow(0 0 14px rgba(0, 71, 255, 0.05));
  }

  /* Dim → bright → hold → dim. Both keyframes carry the same number
     of drop-shadow layers (three) so the browser interpolates each
     layer's blur radius and alpha smoothly between them. The hold
     between 78% and 84% lets the bright moment linger for ~0.5s
     before fading back. */
  @keyframes railBreathe {
    0%, 70%, 100% {
      filter:
        drop-shadow(0 0 2px  rgba(0, 71, 255, 0.30))
        drop-shadow(0 0 6px  rgba(0, 71, 255, 0.12))
        drop-shadow(0 0 14px rgba(0, 71, 255, 0.05));
    }
    78%, 84% {
      filter:
        drop-shadow(0 0 6px  rgba(0, 71, 255, 0.95))
        drop-shadow(0 0 22px rgba(0, 71, 255, 0.65))
        drop-shadow(0 0 52px rgba(0, 71, 255, 0.40));
    }
  }

  /* Honour reduced-motion preference — disable the breathing flare,
     hold a low-intensity static glow instead. */
  @media (prefers-reduced-motion: reduce) {
    .neon-svg { animation: none; }
  }

  /* All gradient stops share the brand colour; opacity varies per stop. */
  .neon-svg stop { stop-color: var(--brand-blue); }

  /* ============================================================
     CONTENT
     ============================================================ */
  .section-inner {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    text-align: center;
    /* Fill remaining vertical space inside .intro-section so the
       space-between distribution actually has room to push the
       closing line to the bottom. Without flex:1 the section-inner
       would collapse to its content height and both children would
       sit stacked at the top. */
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Title + description grouped — sits in the upper half of the
     section, framed by the top road rail. */
  .intro-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 1100px;
  }

  .intro-title {
    font-size: clamp(3rem, 8vw, var(--t-h1-size));
    font-weight: var(--w-h1);
    line-height: var(--lh-h1);
    letter-spacing: -0.02em;
    color: var(--white);
    max-width: 1100px;
  }

  .intro-description {
    font-size: var(--t-xl-size);
    font-weight: var(--w-base);
    line-height: 1.55;
    color: var(--white-72);
    max-width: 640px;
  }
  .intro-description em {
    font-style: normal;
    color: var(--brand-blue);
    font-weight: var(--w-bold);
  }

  /* ----- CLOSING LINE — pinned to the bottom of the section.
     Originally sat directly under the description as a divider-led
     bookend; now it lives at the foot of the landing area, framed
     by the bottom road rail. The dividing border + top padding are
     gone (no longer adjacent to anything to divide from). */
  .closing-line {
    text-align: center;
    width: 100%;
    max-width: 900px;
    margin: 0;
    padding: 0;
  }
  .closing-line-eyebrow {
    font-size: var(--t-eyebrow-size);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--brand-blue);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .closing-line-text {
    font-size: var(--t-xl-size);
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--white-72);
    margin: 0 auto;
  }
  .closing-line-text em {
    font-style: normal;
    color: var(--brand-blue);
    font-weight: 600;
  }

  /* ----- LOGO MARK (bottom-right corner) -----
     Static signature mark hugging the bottom-right corner of the
     section. Decorative — sits outside .section-inner so it doesn't
     shift the centred content above. Hidden on narrow viewports
     (already-tight composition). */
  .intro-mark {
    position: absolute;
    bottom: clamp(6px, 1.2vw, 16px);
    right: clamp(6px, 1.2vw, 16px);
    width: clamp(64px, 8vw, 104px);
    aspect-ratio: 1;
    z-index: 3;
    pointer-events: none;
    opacity: 0.78;
    filter: drop-shadow(0 0 14px rgba(0, 71, 255, 0.35));
  }
  .intro-mark svg { width: 100%; height: 100%; display: block; }
  .intro-mark .mark-stroke {
    stroke: var(--white);
    stroke-width: 18;
    stroke-miterlimit: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* Reduced motion — SMIL animations on the road SVG are paused via
     JS in init(); nothing CSS-driven left to freeze here. */

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px) {
    .intro-section { padding: 56px 20px; min-height: 80vh; }
    .intro-main { gap: 18px; }
    .closing-line-text { font-size: var(--t-lg-size); }
    /* Hide the corner mark on narrow viewports — already-tight composition. */
    .intro-mark { display: none; }
  }
</style>
</head>

<body>

<section class="intro-section" id="dmc01-intro" aria-label="DMC01 — Data Monetisation Concept">

  <!-- Perspective road. Vanishing point at (50, 22) — behind the title.
       Two lane rails diverge to the bottom corners; layered drop-shadow
       on the SVG gives them a static glow. No centre dashes. -->
  <div class="neon-bg" aria-hidden="true">
    <svg class="neon-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <!-- Brand-blue halo at the VP — quiet backlight for the title.
             Pulled back from 0.45 → 0.25 inner so the title text reads
             cleanly; the rail flare now carries the main "wow" moment. -->
        <radialGradient id="introHorizon" cx="50" cy="22" r="40" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-opacity="0.25"/>
          <stop offset="45%"  stop-opacity="0.08"/>
          <stop offset="100%" stop-opacity="0"/>
        </radialGradient>

        <!-- Lane-rail gradient: very dim baseline (rails are barely
             visible most of the time). The cinematic effect comes
             from the railBreathe animation on .neon-svg below — at
             baseline, the rails read as faint suggestions; when the
             flare hits, the bloom around them lights up the whole
             road area. So keep these stops modest. -->
        <linearGradient id="introRail" gradientUnits="userSpaceOnUse"
                        x1="50" y1="22" x2="50" y2="100">
          <stop offset="0%"   stop-opacity="0"/>
          <stop offset="20%"  stop-opacity="0.18"/>
          <stop offset="55%"  stop-opacity="0.28"/>
          <stop offset="100%" stop-opacity="0.38"/>
        </linearGradient>

      </defs>

      <!-- Horizon glow behind the title -->
      <rect x="0" y="0" width="100" height="100" fill="url(#introHorizon)"/>

      <!-- Left lane rail: VP (50, 22) → bottom-left, centred on x=-12.
           ~25% slimmer than the previous version (top 0.30→0.225 vbu,
           bottom 4→3 vbu). -->
      <polygon fill="url(#introRail)"
               points="49.8875,22 50.1125,22 -10.5,100 -13.5,100"/>

      <!-- Right lane rail: mirror, centred on x=112. -->
      <polygon fill="url(#introRail)"
               points="49.8875,22 50.1125,22 113.5,100 110.5,100"/>

      <!-- (No centre line. Earlier iterations had perspective-scaled
           rect dashes and then a stroke-dashed line; both read as
           too busy and competed with the closing-line text. The two
           side rails alone carry the perspective depth cue, with the
           drop-shadow filter on .neon-svg providing a static glow
           that makes the rails feel "alive" without any motion.) -->
    </svg>
  </div>

  <div class="section-inner">

    <!-- Title + description grouped in .intro-main so they form a
         single block at the top of the section. The closing line
         is a separate child of .section-inner and is pushed to the
         bottom by the parent's justify-content: space-between. -->
    <div class="intro-main">
      <h1 class="intro-title">Data Monetisation Concept</h1>

      <p class="intro-description">
        DMC01 is the <em>orchestration layer</em> for monetising data assets — and charting the optimum route to market.
      </p>
    </div>

    <!-- Closing-line — sits at the bottom of the landing area,
         framed by the bottom road rail. -->
    <div class="closing-line">
      <div class="closing-line-eyebrow">Why this matters</div>
      <p class="closing-line-text">Great things are built by people <em>fascinated</em> with how they work.</p>
    </div>

  </div>

  <!-- Signature mark, bottom-right. Decorative; positioned outside
       the .section-inner stack so it doesn't shift the centred content. -->
  <div class="intro-mark" aria-hidden="true">
    <svg viewBox="0 0 595.28 595.28" xmlns="http://www.w3.org/2000/svg">
      <polyline class="mark-stroke"
                points="297.17 265.57 417.4 148.9 177.87 148.9 297.19 479.32 297.17 265.57 177.87 148.9"/>
    </svg>
  </div>

</section>

<script>
(function() {
  'use strict';

  function init() {
    const root = document.querySelector('.intro-section');
    if (!root) {
      console.error('[DMC01-intro] Could not find .intro-section.');
      return;
    }

    /* prefers-reduced-motion: the gradient sweep runs on SMIL, which
       needs an explicit pause (CSS animations are honoured by the UA). */
    const prefersReduced = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      const svg = root.querySelector('.neon-svg');
      if (svg && typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    }

    console.log('[DMC01-intro] Initialised.');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
