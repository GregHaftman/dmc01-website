# =====================================================================
# Cloudflare Worker — dmc01-website
# =====================================================================
#
# Two jobs, one Worker. Connected via Cloudflare Dashboard → Workers &
# Pages → Connect to Git; auto-deploys on every push to `main`.
#
# 1. STATIC FILES — the contents of `webflow/`, each reachable directly
#    off the project hostname (the `webflow/` prefix is stripped):
#      webflow/dmc01-product-v2.js → https://dmc01-website.ghaftman.workers.dev/dmc01-product-v2.js
#      webflow/portrait.svg        → …/portrait.svg
#      webflow/logo-lockup.svg     → …/logo-lockup.svg
#    They exist because Webflow's Code Embed has a 50kB limit.
#
# 2. CONSENT LOG — worker/index.js handles POST /consent from the
#    cookie banner (chrome-footer.html) and stores each choice in KV.
#
# We deliberately do NOT serve the repo root. Wrangler does not honour
# .gitignore for static assets, and an earlier `directory = "."` config
# uploaded the entire repo — including .git/ (full history), .wrangler/
# cache files, and section embed sources — to public URLs. Scoping to
# `./webflow` keeps the public surface to exactly what's meant to be
# fetched externally. To expose a new file, put it in webflow/ and push.
# =====================================================================

name = "dmc01-website"
compatibility_date = "2026-05-01"
workers_dev = true   # explicit: enable the <project>.<account>.workers.dev hostname

# Worker script: only handles POST /consent (cookie-consent records).
# Static files in ./webflow are matched FIRST and served exactly as
# before; the script only sees requests that aren't a file.
main = "worker/index.js"

[assets]
directory = "./webflow"
binding = "ASSETS"

# Consent log (see worker/index.js). Create the namespace once in the
# Cloudflare dashboard (Storage & Databases → KV) and paste its ID here.
[[kv_namespaces]]
binding = "CONSENT_LOG"
id = "4995f81c0da944d485b24f287ac7f3f1"
